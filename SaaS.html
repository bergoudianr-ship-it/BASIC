<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Energia SaaS — Gestão de Contratos</title>
<style>
  :root {
    --bg: #0a0c10; --bg-grad-1: #0c0f15; --bg-grad-2: #0a0c10;
    --surface: #14171f; --surface-2: #181c26; --surface-hover: #1b2030;
    --border: #232834; --border-hover: #313a4d;
    --text: #e6ebf2; --text-2: #97a3b6; --text-3: #5b6678; --text-4: #3f4858;
    --accent: #4f7cff; --accent-2: #6366f1; --accent-soft: rgba(79,124,255,.14);
    --pos: #34d399; --neg: #f87171; --warn: #fbbf24;
    --radius: 14px; --radius-sm: 9px; --radius-xs: 6px;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.55);
    --shadow-hover: 0 2px 4px rgba(0,0,0,.35), 0 16px 40px -16px rgba(0,0,0,.65);
    --shadow-glow: 0 0 0 1px var(--border-hover), 0 12px 32px -14px rgba(79,124,255,.35);
    --ease: cubic-bezier(.4,0,.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; -webkit-font-smoothing: antialiased; background-image: radial-gradient(1200px 600px at 80% -10%, rgba(79,124,255,.07), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(99,102,241,.05), transparent 55%); background-attachment: fixed; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2b3242; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #3a445a; background-clip: padding-box; }
  ::selection { background: var(--accent-soft); color: #fff; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes growIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .header { background: rgba(12,15,21,.72); backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px); border-bottom: 1px solid var(--border); padding: 13px 26px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.4px; display: flex; align-items: center; gap: 0; }
  .logo::before { content: ''; width: 9px; height: 9px; border-radius: 3px; margin-right: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 14px rgba(79,124,255,.7); }
  .logo span { background: linear-gradient(135deg, #6ea0ff, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .header-date { margin-left: auto; color: var(--text-3); font-size: 12px; }
  .header-info { color: var(--text-2); font-size: 12px; }

  .main { display: flex; flex: 1; }
  .sidebar { width: 212px; background: linear-gradient(180deg, rgba(20,23,31,.6), rgba(10,12,16,.3)); border-right: 1px solid var(--border); padding: 14px 12px; flex-shrink: 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 13px; margin: 2px 0; border-radius: var(--radius-sm); color: var(--text-2); cursor: pointer; font-size: 12.5px; font-weight: 500; position: relative; transition: background .18s var(--ease), color .18s var(--ease); }
  .nav-item:hover { background: var(--surface-hover); color: var(--text); }
  .nav-item.active { color: #fff; background: var(--accent-soft); }
  .nav-item.active::before { content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%); width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: linear-gradient(180deg, var(--accent), var(--accent-2)); }
  .nav-section { font-size: 10px; color: var(--text-4); text-transform: uppercase; letter-spacing: 1px; padding: 16px 13px 6px; font-weight: 600; }

  .content { flex: 1; overflow-x: hidden; padding: 26px; }
  #viewBody { animation: fadeUp .32s var(--ease) both; }

  .import-zone { border: 1.5px dashed #2e364a; border-radius: var(--radius); padding: 44px; text-align: center; cursor: pointer; transition: border-color .2s var(--ease), background .2s var(--ease), transform .2s var(--ease); background: var(--surface); }
  .import-zone:hover, .import-zone.dragover { border-color: var(--accent); background: var(--surface-2); transform: translateY(-2px); box-shadow: var(--shadow-glow); }
  .import-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .import-sub { color: var(--text-3); font-size: 12px; margin-bottom: 20px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: transform .12s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease), color .15s var(--ease); }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 6px 18px -8px rgba(79,124,255,.7); }
  .btn-primary:hover { box-shadow: 0 10px 24px -8px rgba(79,124,255,.85); filter: brightness(1.07); }
  .btn-ghost { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-hover); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 17px; box-shadow: var(--shadow); transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease); }
  .card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-hover); }
  .card-title { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 12px; font-weight: 600; }
  .card-value { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .card-sub { font-size: 11px; color: var(--text-3); margin-top: 5px; }
  .card-delta { font-size: 12px; font-weight: 600; margin-top: 5px; }
  .delta-pos { color: var(--pos); } .delta-neg { color: var(--neg); }

  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px; margin-bottom: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; margin-bottom: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px; margin-bottom: 16px; }
  .grid-4 > .card, .grid-3 > .card { animation: fadeUp .4s var(--ease) both; }
  .grid-4 > .card:nth-child(2) { animation-delay: .04s; } .grid-4 > .card:nth-child(3) { animation-delay: .08s; } .grid-4 > .card:nth-child(4) { animation-delay: .12s; }
  @media (max-width: 1200px) { .grid-4 { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 720px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }

  .section-header { display: flex; align-items: center; gap: 10px; margin: 30px 0 15px; }
  .section-title { font-size: 14.5px; font-weight: 700; color: #fff; letter-spacing: -.2px; }
  .section-title::before { content: ''; display: inline-block; width: 4px; height: 15px; border-radius: 2px; margin-right: 9px; vertical-align: -2px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); }

  .table-wrap { overflow-x: auto; border-radius: var(--radius-xs); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; padding: 9px 12px; color: var(--text-3); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 10.5px; white-space: nowrap; text-transform: uppercase; letter-spacing: .4px; position: sticky; top: 0; background: var(--surface); }
  td { padding: 9px 12px; border-bottom: 1px solid rgba(35,40,52,.55); color: var(--text-2); white-space: nowrap; transition: background .12s; }
  tbody tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(79,124,255,.05); color: var(--text); }
  .td-num { text-align: right; font-variant-numeric: tabular-nums; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .1px; }
  .badge-red { background: rgba(248,113,113,.13); color: #fca5a5; border: 1px solid rgba(248,113,113,.28); }
  .badge-yellow { background: rgba(251,191,36,.12); color: #fcd34d; border: 1px solid rgba(251,191,36,.28); }
  .badge-green { background: rgba(52,211,153,.13); color: #6ee7b7; border: 1px solid rgba(52,211,153,.28); }
  .badge-blue { background: rgba(79,124,255,.14); color: #93b4ff; border: 1px solid rgba(79,124,255,.3); }
  .badge-gray { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
  .badge-purple { background: rgba(167,139,250,.13); color: #c4b5fd; border: 1px solid rgba(167,139,250,.3); }

  .alert-row-crit td { background: rgba(248,113,113,.07) !important; box-shadow: inset 3px 0 0 var(--neg); }
  .alert-row-warn td { background: rgba(251,191,36,.06) !important; box-shadow: inset 3px 0 0 var(--warn); }

  .tabs { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 22px; flex-wrap: wrap; }
  .tab { padding: 7px 14px; font-size: 12px; font-weight: 600; color: var(--text-3); cursor: pointer; border-radius: var(--radius-xs); transition: color .15s var(--ease), background .15s var(--ease); }
  .tab:hover { color: var(--text); background: var(--surface-hover); }
  .tab.active { color: #fff; background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(79,124,255,.35); }

  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 17px; box-shadow: var(--shadow); transition: border-color .2s var(--ease), box-shadow .2s var(--ease); }
  .chart-card:hover { border-color: var(--border-hover); }
  .chart-title { font-size: 12px; color: var(--text-2); margin-bottom: 14px; font-weight: 600; }
  .board { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 18px; align-items: start; }
  .board-item { position: relative; border-radius: var(--radius); transition: opacity .15s var(--ease); }
  .board-item.span2 { grid-column: span 2; }
  .board-item.dragging { opacity: .45; }
  .board-item.dragover { outline: 2px dashed #3b82f6; outline-offset: 4px; border-radius: var(--radius); }
  .board-head { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; font-size: 11px; }
  .board-grip { cursor: grab; color: #475569; font-size: 13px; }
  .board-item[draggable="true"] { cursor: default; }
  .board-head .sp { margin-left: auto; display: flex; gap: 4px; }
  .board-btn { background: #11151c; border: 1px solid #232834; border-radius: 5px; color: #94a3b8; font-size: 11px; line-height: 1; padding: 3px 7px; cursor: pointer; }
  .board-btn:hover { color: #e2e8f0; border-color: #3b4252; }
  .widget-tray { display: flex; flex-wrap: wrap; gap: 8px; }
  .tray-chip { background: #11151c; border: 1px solid #232834; border-radius: 999px; color: #cbd5e1; font-size: 12px; padding: 5px 12px; cursor: pointer; transition: border-color .15s var(--ease), background .15s var(--ease); }
  .tray-chip:hover { border-color: #3b82f6; background: #131a26; }
  @media (max-width: 720px) { .board { grid-template-columns: 1fr; } .board-item.span2 { grid-column: span 1; } }

  .ficha { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 11px; box-shadow: var(--shadow); transition: border-color .2s var(--ease), box-shadow .2s var(--ease); overflow: hidden; }
  .ficha:hover { border-color: var(--border-hover); box-shadow: var(--shadow-hover); }
  .ficha-header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background .15s; }
  .ficha-header:hover { background: var(--surface-hover); }
  .ficha-body { padding: 14px 16px 18px; border-top: 1px solid var(--border); animation: fadeIn .25s var(--ease) both; }
  .ficha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .ficha-label { font-size: 10px; color: var(--text-4); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; font-weight: 600; }
  .ficha-value { font-size: 13px; color: var(--text); font-weight: 500; }

  .status-ativo { background: rgba(52,211,153,.14); color: #34d399; border: 1px solid rgba(52,211,153,.3); padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .status-ainc { background: rgba(79,124,255,.14); color: #6ea0ff; border: 1px solid rgba(79,124,255,.3); padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .status-enc { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .status-venc { background: rgba(251,146,60,.14); color: #fb923c; border: 1px solid rgba(251,146,60,.3); padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }

  .pos-long { color: var(--pos); } .pos-short { color: var(--neg); } .pos-zero { color: var(--text-3); }

  .paste-area { width: 100%; min-height: 140px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-2); font-family: 'SF Mono', ui-monospace, monospace; font-size: 12px; padding: 13px; resize: vertical; outline: none; transition: border-color .15s, box-shadow .15s; }
  .paste-area:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .sep { height: 1px; background: var(--border); margin: 10px 13px; }
  .result-box { background: linear-gradient(135deg, rgba(79,124,255,.1), rgba(99,102,241,.05)); border: 1px solid rgba(79,124,255,.25); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  .result-box .rb-title { font-size: 12px; color: #93b4ff; font-weight: 700; margin-bottom: 14px; text-transform: uppercase; letter-spacing: .6px; }
  .empty-state { text-align: center; padding: 64px 20px; animation: fadeUp .4s var(--ease) both; }
  .empty-icon { font-size: 42px; margin-bottom: 14px; opacity: .35; }
  .empty-text { font-size: 14px; color: var(--text-3); }
  .err { color: #fca5a5; font-size: 12px; margin-top: 8px; }
  input[type=text], input[type=number], input[type=date], select { transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft); }

  /* CSS bar chart */
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 180px; padding-top: 10px; }
  .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar-pair { display: flex; gap: 3px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
  .bar { width: 18px; border-radius: 4px 4px 0 0; transform-origin: bottom; animation: growIn .5s var(--ease) both; }
  .bar-label { font-size: 10px; color: var(--text-3); }
  .legend { display: flex; gap: 14px; margin-top: 12px; font-size: 11px; color: var(--text-2); }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }

  /* ── Login / 2FA ── */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-hover); padding: 36px 32px; animation: fadeUp .4s var(--ease) both; }
  .login-brand { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.5px; display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 6px; }
  .login-brand::before { content: ''; width: 11px; height: 11px; border-radius: 3px; margin-right: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 16px rgba(79,124,255,.7); }
  .login-brand span { background: linear-gradient(135deg, #6ea0ff, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .login-sub { text-align: center; color: var(--text-3); font-size: 12.5px; margin-bottom: 26px; }
  .login-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-2); margin: 0 0 6px 2px; letter-spacing: .2px; }
  .login-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; padding: 11px 13px; transition: border-color .15s var(--ease), box-shadow .15s var(--ease); }
  .login-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .login-field { margin-bottom: 16px; }
  .login-btn { width: 100%; justify-content: center; padding: 12px; margin-top: 4px; font-size: 13px; }
  .login-err { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: #fca5a5; font-size: 12px; padding: 9px 12px; border-radius: var(--radius-sm); margin-bottom: 16px; display: none; }
  .login-info { background: var(--accent-soft); border: 1px solid var(--border-hover); color: var(--text-2); font-size: 12px; padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 16px; line-height: 1.5; }
  .login-info b { color: var(--text); }
  .otp-input { width: 100%; text-align: center; letter-spacing: 10px; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 13px; }
  .login-foot { text-align: center; margin-top: 18px; font-size: 12px; color: var(--text-3); }
  .login-link { color: var(--accent); cursor: pointer; font-weight: 600; background: none; border: none; font-size: 12px; }
  .login-link:hover { text-decoration: underline; }
  .login-meta { font-size: 11px; color: var(--text-4); text-align: center; margin-top: 14px; }
</style>
</head>

function normFonte(raw){
  var s=(raw||'').toString().trim(); if(!s) return 'N/D';
  var l=s.toLowerCase();
  function pct(){ if(l.indexOf('100')>=0) return '100%'; if(l.indexOf('80')>=0) return '80%'; if(l.indexOf('50')>=0) return '50%'; if(/(^|[^0-9])0\s*%/.test(l)||l.indexOf('incentivada 0')>=0||/\bi-?0\b/.test(l)||l.indexOf('i zero')>=0||l.indexOf('izero')>=0) return '0%'; return ''; }
  if(l.indexOf('cogera')>=0||l.indexOf('cogeração')>=0||l.indexOf('cqualif')>=0||l==='cq'||l.indexOf('cq ')>=0){ return 'Cogeração Qualificada '+(pct()||'50%'); }
  if(l.indexOf('convenc')>=0||l==='con'||l==='cv') return 'Convencional';
  if(l.indexOf('incentiv')>=0||l.indexOf('especial')>=0){ return 'Incentivada '+(pct()||'50%'); }
  if(/eol|e[oó]lic|vento|ufv|solar|fotovolt|\bpch\b|\bcgh\b|biomass|biog[aá]s|baga[çc]o|pequena central|mini ?central|res[ií]duo/.test(l)){ return 'Incentivada '+(pct()||'50%'); }
  if(/\buhe\b|\bute\b|usina hidr|hidrel[eé]tr|termel|t[eé]rmic|g[aá]s natural|carv[aã]o|[oó]leo|nuclear|f[oó]ssil/.test(l)){ return 'Convencional'; }
  return s;
}
// Normaliza nomes de submercado para o padrão CCEE (SE/CO, S, NE, N).
function normSub(raw){
  var s=(raw||'').toString().trim(); if(!s) return s;
  var l=s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(l.indexOf('sudeste')>=0||l.indexOf('centro')>=0||l==='se'||l==='se/co'||l==='seco'||l==='se-co') return 'SE/CO';
  if(l.indexOf('nordeste')>=0||l==='ne') return 'NE';
  if(l==='norte'||l==='n') return 'N';
  if(l==='sul'||l==='s') return 'S';
  return s;
}

function detectDelim(line){ var c=['\t','|',';',','].map(function(d){return {d:d,n:line.split(d).length};}); c.sort(function(a,b){return b.n-a.n;}); return c[0].d; }

function parseContracts(raw){

function ehBissexto(ano){ return (ano%4===0 && ano%100!==0) || ano%400===0; }

function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function calcularPascoa(y){ // algoritmo de Meeus/Butcher
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
      g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
      l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(y,mes-1,dia);
}
var _feriadosCache={};
function feriadosAno(y){

  // Feriados nacionais fixos (inclui 20/11 Consciência Negra — Lei 14.759/2023).
  var set={}; ['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25','12-31'].forEach(function(md){ set[y+'-'+md]=true; });
  var pa=calcularPascoa(y);
  function rel(off){ var d=new Date(pa); d.setDate(d.getDate()+off); set[isoLocal(d)]=true; }
  rel(-48); rel(-47); // Carnaval (segunda e terça — bancos fechados)

}

function ehFeriado(d){ return !!feriadosAno(d.getFullYear())[isoLocal(d)]; }

// Validações de contratação & modulação à luz das regras de comercialização CCEE.
function cceeValidate(c){
  var a=[];
  // Submercado deve ser um dos 4 submercados de contabilização CCEE.
  if(c.submercado && CCEE.submercados.indexOf(c.submercado)<0)
    a.push({msg:'Submercado "'+c.submercado+'" fora do padrão CCEE (SE/CO, S, NE, N)',crit:'Atenção',regra:'CCEE · Submercado'});
  // Flexibilidade: inferior não pode exceder a superior; banda acima de 100% é atípica no ACL.
  if(c.flexSup>0 && c.flexInf>c.flexSup)
    a.push({msg:'Flexibilidade inferior ('+fmt(c.flexInf,0)+'%) maior que a superior ('+fmt(c.flexSup,0)+'%)',crit:'Crítico',regra:'CCEE · Flexibilidade'});
  if(c.flexSup>100)
    a.push({msg:'Flexibilidade superior de '+fmt(c.flexSup,0)+'% — acima do usual em contratos do ACL',crit:'Atenção',regra:'CCEE · Flexibilidade'});
  // Modulação: coerência energia (MWh) ≈ potência média (MWm) × horas do período.
  var h=horasPeriodo(c.inicioForn,c.fimForn);
  if(h>0 && c.volPrevMWm>0 && c.volPrevMWh>0){
    var esperado=c.volPrevMWm*h, dif=Math.abs(esperado-c.volPrevMWh)/c.volPrevMWh;
    if(dif>CCEE.tolVolume)
      a.push({msg:'Modulação inconsistente: MWm×horas ≈ '+fmt(esperado,0)+' MWh diverge do MWh informado ('+fmt(c.volPrevMWh,0)+') em '+fmt(dif*100,0)+'%',crit:'Atenção',regra:'CCEE · Modulação'});
  }
  // Contrato modulado por curva exige curva de carga carregada para apuração.
  var mod=String(c.modulacao||'').toLowerCase();
  if((mod.indexOf('curva')>=0||mod.indexOf('modula')>=0) && !loadHourly())
    a.push({msg:'Contrato modulado por curva de carga sem curva horária carregada (Backoffice)',crit:'Atenção',regra:'CCEE · Modulação'});
  // Consumidor/energia especial: deve ter lastro em fonte incentivada (desconto TUSD/TUST 50–100%).
  var cl=String(c.classificacao||'').toLowerCase();
  if(cl.indexOf('especial')>=0 && c.fonte && !isIncentivada(c.fonte))
    a.push({msg:'Classificação especial com fonte não incentivada ("'+c.fonte+'") — incompatível com energia incentivada CCEE',crit:'Crítico',regra:'CCEE · Fonte incentivada'});
  // ── Bloco 2 · Medição & Liquidação ──
  var idx=(String(c.indice||'')+' '+String(c.indiceReaj||'')+' '+String(c.tipoSpread||'')).toLowerCase();
  var preco=c.precAj||c.precPrev;
  // Contrato indexado ao PLD: exposição à liquidação de curto prazo entre piso e teto CCEE.
  if(idx.indexOf('pld')>=0)
    a.push({msg:'Indexado ao PLD: exposto à liquidação de curto prazo (piso R$ '+fmt(CCEE.pldMin,2)+' / teto R$ '+fmt(CCEE.pldMax,2)+' — '+(c.submercado||'SE/CO')+')',crit:'Atenção',regra:'CCEE · Liquidação'});
  // Preço fixo fora da banda regulatória de PLD é atípico para hedge de longo prazo.
  if(preco>0 && idx.indexOf('pld')<0){
    if(preco>CCEE.pldMax)
      a.push({msg:'Preço fixo (R$ '+fmt(preco,2)+') acima do teto de PLD (R$ '+fmt(CCEE.pldMax,2)+') — revisar precificação',crit:'Atenção',regra:'CCEE · Liquidação'});
    else if(preco<CCEE.pldMin)
      a.push({msg:'Preço fixo (R$ '+fmt(preco,2)+') abaixo do piso de PLD (R$ '+fmt(CCEE.pldMin,2)+') — revisar precificação',crit:'Atenção',regra:'CCEE · Liquidação'});
  }
  // Risco de submercado (base): liquidação ocorre no PLD do submercado do contrato.
  if(c.submercado && c.submercado!=='SE/CO' && CCEE.submercados.indexOf(c.submercado)>=0){
    var refc=CCEE.pldRef&&CCEE.pldRef[c.submercado], refse=CCEE.pldRef&&CCEE.pldRef['SE/CO'];
    var spreadTxt = (refc!=null&&refse!=null) ? ' (spread atual vs SE/CO: R$ '+fmt(refc-refse,2)+'/MWh)' : '';
    a.push({msg:'Liquidação no submercado '+c.submercado+' — risco de base/spread de PLD frente a SE/CO'+spreadTxt,crit:'Atenção',regra:'CCEE · Submercado'});
  }
  // ── Bloco 3 · Cadastro & Migração ──
  var incent=isIncentivada(c.fonte), esp=cl.indexOf('especial')>=0;
  // Energia incentivada/especial tem desconto na TUSD/TUST (RETUSD) que precisa estar sinalizado.
  if((esp||incent) && !(c.retusd==='sim'||c.retusd==='yes'||c.retusd==='true'||c.retusd===true))
    a.push({msg:'Energia '+(esp?'especial':'incentivada')+' sem sinalização de RETUSD (desconto TUSD/TUST 50–100%) — verificar enquadramento CCEE',crit:'Atenção',regra:'CCEE · Enquadramento'});
  // Fonte incentivada comercializada sem classificação de energia incentivada/especial.
  if(incent && cl && cl.indexOf('especial')<0 && cl.indexOf('incentiv')<0 && cl.indexOf('i5')<0 && cl.indexOf('i1')<0)
    a.push({msg:'Fonte incentivada ("'+c.fonte+'") classificada como "'+c.classificacao+'" — confirmar se deveria ser energia incentivada (I5/I1/I0/especial)',crit:'Atenção',regra:'CCEE · Enquadramento'});
  // Migração ao ACL: início próximo exige denúncia à distribuidora e registro CCEE prévios.
  if(c.inicioForn && c.inicioForn>TODAY){
    var dini=daysDiff(c.inicioForn);
    if(dini<=180 && !c.contratoCCEE)
      a.push({msg:'Início em '+dini+' dias sem Contrato CCEE — prazo de migração/denúncia à distribuidora e registro na CCEE em risco',crit:dini<=90?'Crítico':'Atenção',regra:'CCEE · Migração'});
  }
  // ── Bloco 4 · Penalidades & Garantias ──
  var stc=status(c).code, top=(String(c.tipoOp||'')+' '+String(c.natureza||'')).toLowerCase();
  // Venda exige lastro (garantia física/energia); sem registro CCEE há risco de penalidade por insuficiência de lastro.
  if(top.indexOf('venda')>=0 && !c.contratoCCEE && stc!=='enc' && stc!=='cancelado')
    a.push({msg:'Venda sem Contrato CCEE — risco de penalidade por insuficiência de lastro na contabilização CCEE',crit:'Atenção',regra:'CCEE · Garantias'});
  // Inadimplência: condição de pagamento vencida com fornecimento ativo → risco de execução de garantia financeira.
  if(c.datFimCondPag && c.datFimCondPag<TODAY && stc==='ativo')
    a.push({msg:'Pagamento vencido com fornecimento ativo — risco de inadimplência e execução de garantia financeira na liquidação CCEE',crit:'Crítico',regra:'CCEE · Garantias'});
  return a;
}
// Resumo de lastro/garantias do portfólio (Bloco 4) — usa garantias declaradas em Configurações.
function loadGarantias(){ try{ return JSON.parse(localStorage.getItem('saas_garantias')||'null')||{fisica:0,financeira:0}; }catch(e){ return {fisica:0,financeira:0}; } }
function saveGarantias(g){ try{ localStorage.setItem('saas_garantias',JSON.stringify(g)); }catch(e){} cloudSave('saas_garantias'); }
function garantiaResumo(){
  var g=loadGarantias(), compra=0, venda=0, expPLD=0;
  STATE.contracts.forEach(function(c){
    var st=status(c).code; if(st==='enc'||st==='cancelado') return;
    var mwm=volMWm(c), top=(String(c.tipoOp||'')+' '+String(c.natureza||'')).toLowerCase();
    if(top.indexOf('venda')>=0) venda+=mwm; else if(top.indexOf('compra')>=0) compra+=mwm;
    var idx=(String(c.indice||'')+' '+String(c.indiceReaj||'')).toLowerCase();
    if(idx.indexOf('pld')>=0) expPLD+=Math.abs(volMWh(c));
  });
  var netVenda=venda-compra; // posição líquida vendida (precisa de lastro)
  var lastroReq=Math.max(0,netVenda);
  var deficit=Math.max(0,lastroReq-(g.fisica||0));
  // Garantia financeira aproximada: exposição líquida ao PLD (teto) do período — proxy do requisito CCEE.
  var garReq=expPLD*CCEE.pldMax/1000; // R$ mil aprox.
  return { compra:compra, venda:venda, netVenda:netVenda, lastroReq:lastroReq, fisica:g.fisica||0, deficit:deficit, garReq:garReq, garAportada:g.financeira||0, expPLD:expPLD };
}

// Atualiza parâmetros CCEE com dados reais do banco (PLD piso/teto/ref por submercado).
function fetchCCEEParams(){
  if(!sb) return Promise.resolve();
  var normSub={'sudeste/centro-oeste':'SE/CO','se/co':'SE/CO','sul':'S','sudeste':'SE/CO','nordeste':'NE','norte':'N','ne':'NE','n':'N','s':'S'};
  return sb.from('ipdo_cmo_pld').select('subsistema,data_operacao,pld,pld_piso,pld_teto')
    .order('data_operacao',{ascending:false}).limit(400).then(function(r){
      if(r.error||!r.data) return;
      var ref={}, piso=null, teto=null;
      r.data.forEach(function(row){
        var sub=normSub[String(row.subsistema||'').toLowerCase()]||row.subsistema;
        if(row.pld!=null && ref[sub]==null) ref[sub]=Number(row.pld);
        if(piso==null && row.pld_piso!=null){ piso=Number(row.pld_piso); }
        if(teto==null && row.pld_teto!=null){ teto=Number(row.pld_teto); }
      });
      if(piso!=null) CCEE.pldMin=piso;
      if(teto!=null) CCEE.pldMax=teto;
      CCEE.pldRef=ref;
    }).catch(function(){});
}
function status(c){
  if(c.cancelado) return {label:'Cancelado',cls:'status-enc',code:'cancelado'};
  if(!c.inicioForn||!c.fimForn) return {label:'Indefinido',cls:'status-enc',code:'indef'};
  var d=daysDiff(c.fimForn);
  if(c.fimForn<TODAY) return {label:'Encerrado',cls:'status-enc',code:'enc'};
  if(c.inicioForn>TODAY) return {label:'A iniciar',cls:'status-ainc',code:'ainc'};
  if(d<=30) return {label:'Vencendo em '+d+'d',cls:'status-venc',code:'venc'};
  return {label:'Ativo',cls:'status-ativo',code:'ativo'};
}
function alerts(c){
  var a=[], st=status(c);

  if(!c.contratoCCEE) a.push({msg:'Sem Contrato CCEE registrado',crit:'Crítico'});
  if((c.possuiAjVol==='sim'||c.possuiAjVol==='yes')&&c.volAjMWm===0) a.push({msg:'Ajuste de volume pendente',crit:'Atenção'});
  if((c.possuiAjPreco==='sim'||c.possuiAjPreco==='yes')&&c.precAj===0) a.push({msg:'Ajuste de preço pendente',crit:'Atenção'});
  if(c.possuiAjSub==='sim'||c.possuiAjSub==='yes') a.push({msg:'Ajuste de submercado pendente',crit:'Atenção'});
  if(st.code==='ativo'&&c.valorNF===0) a.push({msg:'Valor NF zerado com fornecimento ativo',crit:'Crítico'});
  if(c.datFimCondPag&&c.datFimCondPag<TODAY) a.push({msg:'Condição de pagamento vencida',crit:'Atenção'});
  if(c.dataPrimReaj){ var dr=daysDiff(c.dataPrimReaj); if(dr<0) a.push({msg:'1º reajuste vencido sem aplicação',crit:'Atenção'}); else if(dr<=30) a.push({msg:'1º reajuste em '+dr+' dias',crit:'Atenção'}); }
  if((c.flexSup>0||c.flexInf>0)&&st.code==='venc') a.push({msg:'Flexibilidade próxima do vencimento sem exercício',crit:'Crítico'});

  return a;

function cssBars(data, keys, colors, names){
  var max=0; data.forEach(function(d){ keys.forEach(function(k){ if(d[k]>max) max=d[k]; }); }); if(max===0) max=1;
  var h='<div class="bars">';
  data.forEach(function(d){
    h+='<div class="bar-group"><div class="bar-pair">';
    keys.forEach(function(k,i){ var pct=Math.max(2,(d[k]/max)*100); h+='<div class="bar" title="'+esc(names[i])+': '+fmt(d[k],2)+'" style="height:'+pct+'%;background:'+colors[i]+'"></div>'; });
    h+='</div><div class="bar-label">'+esc(d.name||d.label)+'</div></div>';
  });
  h+='</div><div class="legend">';
  names.forEach(function(n,i){ h+='<span><span class="legend-dot" style="background:'+colors[i]+'"></span>'+esc(n)+'</span>'; });
  h+='</div>';
  return h;
}
function lineChart(data, key, color){
  var w=900,hgt=200,pad=30; var vals=data.map(function(d){return d[key];});
  var max=Math.max.apply(null,vals.concat([0])), min=Math.min.apply(null,vals.concat([0]));
  if(max===min){max+=1;min-=1;}
  var sx=function(i){ return pad+i*((w-2*pad)/(data.length-1||1)); };
  var sy=function(v){ return pad+(1-(v-min)/(max-min))*(hgt-2*pad); };
  var pts=data.map(function(d,i){return sx(i)+','+sy(d[key]);}).join(' ');
  var zero=sy(0);
  var s='<svg viewBox="0 0 '+w+' '+hgt+'" style="width:100%;height:200px">';
  s+='<line x1="'+pad+'" y1="'+zero+'" x2="'+(w-pad)+'" y2="'+zero+'" stroke="#2d3148" stroke-dasharray="3 3"/>';
  s+='<polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+pts+'"/>';
  data.forEach(function(d,i){ s+='<circle cx="'+sx(i)+'" cy="'+sy(d[key])+'" r="2.5" fill="'+color+'"><title>'+esc(d.label)+': '+fmt(d[key],2)+'</title></circle>'; });
  s+='</svg>';
  return s;
}
function pieList(data){
  var total=data.reduce(function(s,x){return s+x.value;},0)||1;
  var rows=data.slice().sort(function(a,b){return b.value-a.value;}).map(function(f,i){
    return '<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+COLORS[i%COLORS.length]+';margin-right:6px"></span>'+esc(f.name)+'</td><td class="td-num">'+fmt(f.value,2)+'</td><td class="td-num">'+fmt((f.value/total)*100,1)+'%</td></tr>';
  }).join('');
  return '<table><thead><tr><th>Fonte</th><th>MWm</th><th>%</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

// ── Compute stats ────────────────────────────────────────────────────────
function computeStats(cs){
  cs=cs.filter(function(c){return !c.cancelado;});
  var ativos=cs.filter(function(c){return status(c).code==='ativo';});
  var ainc=cs.filter(function(c){return status(c).code==='ainc';});
  var enc=cs.filter(function(c){return status(c).code==='enc';});
  var compras=cs.filter(isCompra), vendas=cs.filter(isVenda);
  var volC=compras.reduce(function(s,c){return s+volMWm(c);},0);
  var volV=vendas.reduce(function(s,c){return s+volMWm(c);},0);
  var volCh=compras.reduce(function(s,c){return s+volMWh(c);},0);
  var volVh=vendas.reduce(function(s,c){return s+volMWh(c);},0);
  var rec=vendas.reduce(function(s,c){return s+expFin(c);},0);
  var custo=compras.reduce(function(s,c){return s+expFin(c);},0);
  var margem=rec-custo;
  var bySub={}; cs.forEach(function(c){ var s=c.submercado||'N/D'; if(!bySub[s])bySub[s]={compra:0,venda:0}; if(isCompra(c))bySub[s].compra+=volMWm(c); else bySub[s].venda+=volMWm(c); });
  var byFonte={}; cs.forEach(function(c){ var f=c.fonte||'N/D'; byFonte[f]=(byFonte[f]||0)+volMWm(c); });
  var byNeg={}; cs.forEach(function(c){ var n=c.negociante||'N/D'; if(!byNeg[n])byNeg[n]={vol:0,val:0,count:0}; byNeg[n].vol+=volMWm(c); byNeg[n].val+=expFin(c); byNeg[n].count++; });
  var byEmp={}; cs.forEach(function(c){ var e=c.empresa||'N/D'; if(!byEmp[e])byEmp[e]={vol:0,val:0,count:0}; byEmp[e].vol+=volMWm(c); byEmp[e].val+=expFin(c); byEmp[e].count++; });
  var ret=cs.filter(function(c){return c.retusd==='sim'||c.retusd==='yes';});
  var months=[];
  for(var i=0;i<24;i++){ var d=new Date(TODAY); d.setMonth(d.getMonth()+i); var st=new Date(d.getFullYear(),d.getMonth(),1), en=new Date(d.getFullYear(),d.getMonth()+1,0);
    var act=cs.filter(function(c){return c.inicioForn&&c.fimForn&&c.inicioForn<=en&&c.fimForn>=st;});
    var comp=act.filter(isCompra).reduce(function(s,c){return s+volMWm(c);},0);
    var vend=act.filter(isVenda).reduce(function(s,c){return s+volMWm(c);},0);
    var pcVal=act.filter(isCompra).reduce(function(s,c){return s+expFin(c);},0);
    var pvVal=act.filter(isVenda).reduce(function(s,c){return s+expFin(c);},0);
    var pcVh=act.filter(isCompra).reduce(function(s,c){return s+volMWh(c);},0);
    var pvVh=act.filter(isVenda).reduce(function(s,c){return s+volMWh(c);},0);
    months.push({label:d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}),comp:comp,vend:vend,saldo:vend-comp,pmComp:pcVh>0?pcVal/pcVh:0,pmVend:pvVh>0?pvVal/pvVh:0,resultado:pvVal-pcVal});
  }
  return { total:cs.length,ativos:ativos.length,ainc:ainc.length,enc:enc.length,volC:volC,volV:volV,volCh:volCh,volVh:volVh,posLiq:volV-volC,
    rec:rec,custo:custo,margem:margem,margemPct:rec>0?margem/rec*100:0,ticket:cs.length>0?(rec+custo)/cs.length:0,
    pmC:volCh>0?custo/volCh:0,pmV:volVh>0?rec/volVh:0,bySub:bySub,byFonte:byFonte,byNeg:byNeg,byEmp:byEmp,
    retCount:ret.length,expUSD:ret.reduce(function(s,c){return s+expFin(c);},0),
    ajVol:cs.filter(function(c){return (c.possuiAjVol==='sim')&&c.volAjMWm===0;}).length,
    ajPrec:cs.filter(function(c){return (c.possuiAjPreco==='sim')&&c.precAj===0;}).length,
    semCCEE:cs.filter(function(c){return !c.contratoCCEE;}).length,
    nfPend:ativos.filter(function(c){return c.valorNF===0;}).length, months:months };
}

function loadDashLayout(){ try{ var a=JSON.parse(localStorage.getItem('saas_dashboard_layout')||'null'); if(a&&a.length) return a; }catch(e){} return DEFAULT_LAYOUT.map(function(x){return {id:x.id,span:x.span};}); }
function saveDashLayout(a){ try{ localStorage.setItem('saas_dashboard_layout',JSON.stringify(a)); }catch(e){} cloudSave('saas_dashboard_layout'); }
function layoutHasId(l,id){ for(var i=0;i<l.length;i++) if(l[i].id===id) return true; return false; }
function layoutIdx(l,id){ for(var i=0;i<l.length;i++) if(l[i].id===id) return i; return -1; }
// Reconcilia widgets recém-registrados: na 1ª execução semeia "conhecidos";
// depois, todo widget novo é anexado automaticamente ao painel.
function reconcileWidgets(layout){
  var raw=null; try{ raw=localStorage.getItem('saas_dashboard_known'); }catch(e){}
  if(raw==null){ var k0={}; WIDGETS.forEach(function(w){k0[w.id]=1;}); try{ localStorage.setItem('saas_dashboard_known',JSON.stringify(k0)); }catch(e){} return layout; }
  var known={}; try{ known=JSON.parse(raw)||{}; }catch(e){}
  var changed=false;
  WIDGETS.forEach(function(w){ if(!known[w.id]){ known[w.id]=1; changed=true; if(!layoutHasId(layout,w.id)) layout.push({id:w.id,span:w.span||1}); } });
  if(changed){ try{ localStorage.setItem('saas_dashboard_known',JSON.stringify(known)); }catch(e){} saveDashLayout(layout); }
  return layout;
}

function viewDashboard(){

  var inL={}; layout.forEach(function(it){inL[it.id]=true;});

    '<span style="margin-left:auto;display:flex;gap:8px">'+

    '<button class="btn btn-ghost" id="dashReset">Restaurar padrão</button></span></div>';
  h+='<div id="dashTray" class="card" style="display:none;margin-bottom:14px"><div class="card-title">Informações disponíveis — clique para adicionar ao painel</div>';
  if(avail.length){ h+='<div class="widget-tray">'; avail.forEach(function(w){ h+='<button class="tray-chip" data-add="'+w.id+'">＋ '+esc(w.title)+' <span style="color:#475569">· '+esc(w.source)+'</span></button>'; }); h+='</div>'; }
  else { h+='<div style="color:#64748b;font-size:12px">Todas as informações já estão no painel.</div>'; }
  h+='</div>';
  h+='<div style="color:#5b6678;font-size:11px;margin-bottom:10px">Arraste pelos cards (ou use ↑ ↓) para reordenar · ▭/▣ alterna largura · ✕ remove. O layout fica salvo neste navegador.</div>';
  h+='<div class="board" id="dashBoard">';
  layout.forEach(function(it){ var w=WIDGET_MAP[it.id]; if(!w) return; var span=it.span||w.span||1;
    h+='<div class="board-item'+(span>=2?' span2':'')+'" draggable="true" data-wid="'+it.id+'">'+
      '<div class="board-head"><span class="board-grip" title="Arraste para reordenar">⠿</span><span style="color:#94a3b8">'+esc(w.title)+'</span><span style="color:#3b4252">· '+esc(w.source)+'</span>'+
      '<span class="sp"><button class="board-btn" data-move="up" data-wid="'+it.id+'" title="Subir">↑</button><button class="board-btn" data-move="down" data-wid="'+it.id+'" title="Descer">↓</button><button class="board-btn" data-size data-wid="'+it.id+'" title="Largura">'+(span>=2?'▣':'▭')+'</button><button class="board-btn" data-remove data-wid="'+it.id+'" title="Remover">✕</button></span></div>'+
      '<div class="board-body">'+w.render(s)+'</div></div>';
  });
  h+='</div>';
  if(!layout.length) h+='<div class="empty-state"><div class="empty-icon">▤</div><div class="empty-text">Painel vazio. Clique em "Adicionar informação" para montar seu dashboard.</div></div>';
  return h;
}
function bindDashboard(){
  function rerender(l){ if(l) saveDashLayout(l); document.getElementById('viewBody').innerHTML=viewDashboard(); bindDashboard(); }
  var tg=document.getElementById('dashAddToggle'), tray=document.getElementById('dashTray');
  if(tg&&tray) tg.onclick=function(){ tray.style.display=tray.style.display==='none'?'block':'none'; };
  var rs=document.getElementById('dashReset'); if(rs) rs.onclick=function(){ rerender(DEFAULT_LAYOUT.map(function(x){return {id:x.id,span:x.span};})); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-add]'),function(el){ el.onclick=function(){ var id=el.getAttribute('data-add'); var l=loadDashLayout().filter(function(it){return WIDGET_MAP[it.id];}); if(!layoutHasId(l,id)){ var w=WIDGET_MAP[id]; l.push({id:id,span:w?(w.span||1):1}); } rerender(l); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-remove]'),function(el){ el.onclick=function(){ var id=el.getAttribute('data-wid'); var l=loadDashLayout().filter(function(it){return WIDGET_MAP[it.id]&&it.id!==id;}); rerender(l); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-size]'),function(el){ el.onclick=function(){ var id=el.getAttribute('data-wid'); var l=loadDashLayout().filter(function(it){return WIDGET_MAP[it.id];}); var i=layoutIdx(l,id); if(i>=0) l[i].span=(l[i].span>=2?1:2); rerender(l); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-move]'),function(el){ el.onclick=function(){ var id=el.getAttribute('data-wid'), dir=el.getAttribute('data-move'); var l=loadDashLayout().filter(function(it){return WIDGET_MAP[it.id];}); var i=layoutIdx(l,id); if(i<0) return; var j=dir==='up'?i-1:i+1; if(j<0||j>=l.length) return; var tmp=l[i]; l[i]=l[j]; l[j]=tmp; rerender(l); }; });
  // drag & drop
  var dragId=null;
  Array.prototype.forEach.call(document.querySelectorAll('#dashBoard .board-item'),function(el){
    el.addEventListener('dragstart',function(e){ dragId=el.getAttribute('data-wid'); el.classList.add('dragging'); try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragId); }catch(x){} });
    el.addEventListener('dragend',function(){ el.classList.remove('dragging'); Array.prototype.forEach.call(document.querySelectorAll('#dashBoard .board-item'),function(i){i.classList.remove('dragover');}); });
    el.addEventListener('dragover',function(e){ e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave',function(){ el.classList.remove('dragover'); });
    el.addEventListener('drop',function(e){ e.preventDefault(); var tid=el.getAttribute('data-wid'); if(!dragId||dragId===tid) return; var l=loadDashLayout().filter(function(it){return WIDGET_MAP[it.id];}); var from=layoutIdx(l,dragId), to=layoutIdx(l,tid); if(from<0||to<0) return; var moved=l.splice(from,1)[0]; l.splice(to,0,moved); rerender(l); });
  });
}

function viewContratos(){

  var custo=compras.reduce(function(s,c){return s+expFin(c);},0);

  var cVh=compras.reduce(function(s,c){return s+volMWh(c);},0);

    metric('Custo (Compra)',fmtR(custo))+
    metric('Margem Bruta',fmtR(rec-custo),(rec>0?fmt((rec-custo)/rec*100,1):'0')+'%',null,rec-custo)+
    metric('PM Venda vs Compra','R$ '+fmt(pmV-pmC)+'/MWh','V: R$'+fmt(pmV)+' · C: R$'+fmt(pmC),null,pmV-pmC)+'</div></div>';
  h+='<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">'+
    '<button class="btn btn-primary" id="ctCreateToggle">'+(CT_SHOW_CREATE?'✕ Fechar formulário':'＋ Criar contrato')+'</button>'+
    '<button class="btn btn-ghost" id="ctAjusteToggle">'+(CT_SHOW_AJUSTE?'✕ Fechar ajuste mensal':'Ajuste mensal')+'</button>'+
    '</div>';

  if(CT_SHOW_AJUSTE) h+=ajusteMensalCard(csAll);
  var filters=[['todos','Todos'],['ativo','Ativos'],['ainc','A iniciar'],['enc','Encerrados'],['alerta','Com alertas'],['cancelado','Cancelados']];
  var ctHasFilter=CT_MES||CT_DATA||CT_INI||CT_FIM||CT_SEARCH||CT_COL_EMP||CT_COL_NEG||CT_COL_TIPO||CT_COL_SUB||CT_COL_FONTE||CT_COL_CLASSIF||CT_COL_STATUS;

    '<label style="display:flex;flex-direction:column;gap:4px"><span class="ficha-label">Data específica</span><input type="date" id="ctData" value="'+esc(CT_DATA)+'" style="background:#0f1117;border:1px solid #2d3148;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:12px;width:150px"></label>'+
    '<label style="display:flex;flex-direction:column;gap:4px"><span class="ficha-label">Início do suprimento (de)</span><input type="date" id="ctIni" value="'+esc(CT_INI)+'" style="background:#0f1117;border:1px solid #2d3148;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:12px;width:150px"></label>'+
    '<label style="display:flex;flex-direction:column;gap:4px"><span class="ficha-label">Fim do suprimento (até)</span><input type="date" id="ctFim" value="'+esc(CT_FIM)+'" style="background:#0f1117;border:1px solid #2d3148;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:12px;width:150px"></label>'+
    '<label style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:220px"><span class="ficha-label">Buscar (negócio, empresa, CCEE, submercado, fonte, negociante...)</span><input type="text" id="ctSearch" value="'+esc(CT_SEARCH)+'" placeholder="Pesquisa rápida" style="background:#0f1117;border:1px solid #2d3148;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:12px;width:100%"></label>'+

    '</div>';

  filtered=filtered.filter(function(c){ return monthOverlap(c,CT_MES)&&dateOverlap(c,CT_DATA)&&rangeOverlap(c,CT_INI,CT_FIM)&&matchesSearch(c,CT_SEARCH); });
  filtered=filtered.filter(function(c){
    if(CT_COL_EMP&&c.empresa!==CT_COL_EMP) return false;

  h+=contratosQuadroHTML(csAll,filtered);
  if(!filtered.length){ return h+'<div class="empty-state"><div class="empty-text">Nenhum contrato nesta categoria/filtro</div></div>'; }
  filtered.forEach(function(c){ h+=fichaHTML(c); });
  return h;

function bindCriarContrato(){
  function v(id){ var e=document.getElementById(id); return e?e.value:''; }
  function err(m){ var e=document.getElementById('ncErr'); if(e){ e.textContent=m; e.style.display='block'; } }
  function syncTipoPreco(){
    var inc=!isConvencional(v('ncFonte'));
    var box=document.getElementById('ncTipoPrecoBox'), sec=document.getElementById('ncSpreadSec');
    if(box) box.textContent=inc?'Preço fixo + Spread':'Preço fixo';
    if(sec) sec.style.display=inc?'':'none';
  }
  var fonteEl=document.getElementById('ncFonte'); if(fonteEl){ fonteEl.onchange=syncTipoPreco; syncTipoPreco(); }
  var cr=document.getElementById('ncCreate');
  if(cr) cr.onclick=function(){
    var emp=v('ncEmp').trim(), vol=parseFloat(v('ncVol')), preco=parseFloat(v('ncPreco'));
    if(!emp){ err('Informe a contraparte.'); return; }
    if(isNaN(vol)||vol<=0){ err('Informe um volume válido (MWm).'); return; }
    if(isNaN(preco)||preco<=0){ err('Informe um preço válido (R$/MWh).'); return; }

function bindAjusteMensal(){

    if(!sel||!sel.value){ err('Nenhum contrato selecionado.'); return; }

function basePrice(M,k){ if(M.base&&M.base[k]!=null&&M.base[k]!=='') return +M.base[k]; return null; }
function subFixedPrice(M,sub,k){ if(M.subPrice[sub]&&M.subPrice[sub][k]!=null&&M.subPrice[sub][k]!=='') return +M.subPrice[sub][k]; return null; }
function convPrice(M,sub,k){ if(sub==='SE/CO') return basePrice(M,k); return subFixedPrice(M,sub,k); }
function curvePrice(M,sub,fonte,k){
  var cp=convPrice(M,sub,k); if(cp==null) return null;
  if(isConvencional(fonte)) return cp;
  var so=M.spread[fonte]; var sp=(so&&so[k]!=null&&so[k]!=='')?+so[k]:0;
  return cp + sp;
}
function incFontesList(cs){ var arr=[]; cs.forEach(function(c){ if(!isConvencional(c.fonte)&&arr.indexOf(c.fonte)<0) arr.push(c.fonte); }); arr.sort(); return arr; }
// média ponderada da convencional entre submercados, ponderada pelo volume convencional do portfólio no mês
function wavgConv(cs,M,k){ var num=0,den=0,simpleN=0,simpleD=0; var ms=mKeyToDate(k), me=new Date(ms.getFullYear(),ms.getMonth()+1,0);
  SUBS_STD.forEach(function(sub){ var p=convPrice(M,sub,k); if(p==null) return; simpleN+=p; simpleD++;
    var vol=0; cs.forEach(function(c){ if(isConvencional(c.fonte)&&c.submercado===sub&&c.inicioForn&&c.fimForn&&c.inicioForn<=me&&c.fimForn>=ms) vol+=volMWm(c); });
    num+=p*vol; den+=vol; });
  if(den>0) return num/den; if(simpleD>0) return simpleN/simpleD; return null;
}
function monthsForContract(c,M){ if(!c.inicioForn||!c.fimForn) return []; var start=mKeyToDate(M.refMonth); var cs2=new Date(c.inicioForn.getFullYear(),c.inicioForn.getMonth(),1); if(cs2>start) start=cs2; var arr=[],d=new Date(start),end=new Date(c.fimForn.getFullYear(),c.fimForn.getMonth(),1),g=0; while(d<=end&&g<60){ arr.push(new Date(d)); d.setMonth(d.getMonth()+1); g++; } return arr; }
function hoursOverlap(c,md){ var ms=new Date(md.getFullYear(),md.getMonth(),1), me=new Date(md.getFullYear(),md.getMonth()+1,0); var s=c.inicioForn>ms?c.inicioForn:ms, e=c.fimForn<me?c.fimForn:me; if(e<s) return 0; var days=Math.round((e-s)/86400000)+1; return days*24; }
function mtmContractCurve(c,M){ var P=c.precAj||c.precPrev, total=0; monthsForContract(c,M).forEach(function(md){ var price=curvePrice(M,c.submercado,c.fonte,mKey(md)); if(price==null) return; var mwh=volMWm(c)*hoursOverlap(c,md); total += isCompra(c)?(price-P)*mwh : isVenda(c)?(P-price)*mwh : 0; }); return total; }
function fwdMonths(cs,M){ var pend=portfolioEnd(cs); var months=[]; if(pend){ var d=mKeyToDate(M.refMonth); d.setMonth(d.getMonth()+1); var end=new Date(pend.getFullYear(),pend.getMonth(),1),g=0; while(d<=end&&g<18){ months.push(mKey(d)); d.setMonth(d.getMonth()+1); g++; } } return months; }
function curveMonths(cs,M){ return [M.refMonth].concat(fwdMonths(cs,M)); }
function MTM_PRODUCTS(cs){ var p=[]; cs.forEach(function(c){ var k=productKey(c); if(p.indexOf(k)<0)p.push(k); }); p.sort(); return p; }

function mtmCSVHeader(cs){ return ['Mes','SE/CO'].concat(SUBS_OTHER).concat(incFontesList(cs).map(function(f){return 'Spread '+f;})); }
function mtmTemplateCSV(cs,M){
  var months=curveMonths(cs,M), incFontes=incFontesList(cs);
  var lines=[mtmCSVHeader(cs).join(';')];
  months.forEach(function(k){
    var row=[k];
    row.push(M.base[k]!=null?String(M.base[k]).replace('.',','):'');
    SUBS_OTHER.forEach(function(sub){ var v=(M.subPrice[sub]&&M.subPrice[sub][k]!=null)?M.subPrice[sub][k]:''; row.push(v!==''?String(v).replace('.',','):''); });
    incFontes.forEach(function(f){ var v=(M.spread[f]&&M.spread[f][k]!=null)?M.spread[f][k]:''; row.push(v!==''?String(v).replace('.',','):''); });
    lines.push(row.join(';'));
  });
  return lines.join('\n');
}
function applyMtMCSV(raw,cs,M){
  var rows=parseCSV(raw); if(!rows.length) throw new Error('CSV vazio ou sem linhas de dados.');
  var incFontes=incFontesList(cs);
  rows.forEach(function(r){
    var k=(g(r,['Mes','Mês'])||'').toString().trim(); if(!k) return;
    var vb=g(r,['SE/CO']); if(vb!=='') M.base[k]=num(vb);
    SUBS_OTHER.forEach(function(sub){ var v=g(r,[sub]); if(v!==''){ if(!M.subPrice[sub])M.subPrice[sub]={}; M.subPrice[sub][k]=num(v); } });
    incFontes.forEach(function(f){ var v=g(r,['Spread '+f]); if(v!==''){ if(!M.spread[f])M.spread[f]={}; M.spread[f][k]=num(v); } });
  });
}

function loadHourly(){ try{ return JSON.parse(localStorage.getItem('saas_curvahoraria')||'null'); }catch(e){ return null; } }
function saveHourly(o){ try{ localStorage.setItem('saas_curvahoraria', o?JSON.stringify(o):''); if(!o) localStorage.removeItem('saas_curvahoraria'); }catch(e){} }
// Envelope contratado: base, limites sazonais (% do contratado) e flexíveis (desvio sobre o contratado)
function backofficeRow(c){
  var base=c.volPrevMWm||0;
  var sazSup=c.sazSup||0, sazInf=c.sazInf||0, flexSup=c.flexSup||0, flexInf=c.flexInf||0;
  var sazMax=sazSup>0?base*sazSup/100:base, sazMin=sazInf>0?base*sazInf/100:base;
  var flexMax=base*(1+flexSup/100), flexMin=base*(1-flexInf/100);
  var envMax=Math.max(sazMax,flexMax), envMin=Math.min(sazMin,flexMin);
  var exercido=c.volAjMWm||0, has=exercido>0;
  var delta=has?exercido-base:0, deltaPct=(base>0&&has)?delta/base*100:0;
  var within=!has||(exercido<=envMax+1e-6&&exercido>=envMin-1e-6);
  return {base:base,sazMin:sazMin,sazMax:sazMax,flexMin:flexMin,flexMax:flexMax,envMin:envMin,envMax:envMax,exercido:exercido,has:has,delta:delta,deltaPct:deltaPct,within:within};
}

function hourlyTemplateCSV(){
  var lines=['Data;Hora;Consumo (MWh);Geração (MWh)'];
  for(var i=0;i<24;i++){ lines.push('2026-01-01;'+String(i).padStart(2,'0')+':00;1,000;0,000'); }
  return lines.join('\n');
}
function monthlyTemplateCSV(){
  var now=new Date();
  var y=now.getFullYear(), m=now.getMonth(); // mês anterior ao atual
  var pm=m-1, py=y; if(pm<0){ pm=11; py=y-1; }
  var daysInMonth=new Date(py,pm+1,0).getDate();
  var lines=['Data;Hora;Consumo (MWh);Geração (MWh)'];
  for(var d=1;d<=daysInMonth;d++){
    var dateStr=py+'-'+String(pm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    for(var i=0;i<24;i++){ lines.push(dateStr+';'+String(i).padStart(2,'0')+':00;1,000;0,000'); }
  }
  return lines.join('\n');
}
function parseHourly(raw){
  var rows=parseCSV(raw);
  var byHour={}; for(var i=0;i<24;i++) byHour[i]={cons:0,ger:0,n:0};
  var totCons=0,totGer=0,count=0;
  rows.forEach(function(r){
    var hraw=g(r,['Hora','Hour','hora']); var hh=parseInt(String(hraw).split(':')[0],10);
    if(isNaN(hh)){ var draw=g(r,['Data','Data/Hora','DataHora','Timestamp','Datahora']); var m=String(draw).match(/(\d{1,2}):(\d{2})/); if(m) hh=parseInt(m[1],10); }
    if(isNaN(hh)||hh<0||hh>23) return;
    var cons=num(g(r,['Consumo (MWh)','Consumo','Consumo (MW)','consumo']));
    var ger=num(g(r,['Geração (MWh)','Geracao (MWh)','Geração','Geracao','geracao','Geração (MW)']));
    byHour[hh].cons+=cons; byHour[hh].ger+=ger; byHour[hh].n++; totCons+=cons; totGer+=ger; count++;
  });
  if(!count) throw new Error('Nenhuma linha horária válida (verifique colunas Hora e Consumo).');
  var hours=[],sumC=0,sumN=0;
  for(var j=0;j<24;j++){ var b=byHour[j]; var aC=b.n?b.cons/b.n:0, aG=b.n?b.ger/b.n:0; hours.push({h:j,cons:aC,ger:aG,net:aC-aG}); sumC+=aC; sumN+=(aC-aG); }
  var avgC=sumC/24, avgN=sumN/24;
  var peakC=Math.max.apply(null,hours.map(function(x){return x.cons;}));
  hours.forEach(function(x){ x.modCons=avgC>0?x.cons/avgC:0; x.modNet=avgN!==0?x.net/avgN:0; });
  return {hours:hours,totCons:totCons,totGer:totGer,totNet:totCons-totGer,count:count,avgCons:avgC,avgNet:avgN,peakCons:peakC,fatorCarga:peakC>0?avgC/peakC:0};
}

function propMWh(p){ var ini=p.inicio?new Date(p.inicio):null, fim=p.fim?new Date(p.fim):null; var horas=(ini&&fim&&fim>=ini)?((fim-ini)/3600000+24):0; return p.vol*horas; }
function propExposure(p){ var ini=p.inicio?new Date(p.inicio):null, fim=p.fim?new Date(p.fim):null; var horas=(ini&&fim&&fim>=ini)?((fim-ini)/3600000+24):0; return p.vol*horas*p.preco; }
function contractFromProposal(p){
  var ini=p.inicio?new Date(p.inicio):null, fim=p.fim?new Date(p.fim):null;
  var horas=(ini&&fim&&fim>=ini)?((fim-ini)/3600000+24):0;
  return { _id:'op_'+Date.now()+'_'+Math.floor(Math.random()*10000),
    negocio:p.negocio||('OP-'+Date.now()), entrega:p.entrega||'', unidadeNegocio:p.unidade||'', tipoOp:p.tipoOp, natureza:p.natureza||'Bilateral',
    empresa:p.empresa, negociante:p.negociante||'', operador:p.operador||'', origem:p.origem||'Proposta aprovada',
    dataCriacao:new Date(), contratoCCEE:p.ccee||'', inicioForn:ini, fimForn:fim,
    volPrevMWm:p.vol, volPrevMWh:p.vol*horas, volAjMWm:0, volAjMWh:0, possuiAjVol:'não',
    submercado:p.submercado, possuiAjSub:'não', fonte:normFonte(p.fonte), retusd:(p.ret||'não').toLowerCase(), classificacao:p.classif||'ACL',
    modulacao:p.sazTipo||p.saz||'', formaConsumo:p.formaConsumo||'Flat', sazSup:p.sazSup||0, sazInf:p.sazInf||0, flexMensal:0, flexSup:p.flexSup||0, flexInf:p.flexInf||0, volDiferenciado:(p.sazTipo&&p.sazTipo!=='Flat')?'Sim':'Não', condPag:p.condPag||'', datIniCondPag:null, datFimCondPag:null, obsFinanceiro:'Operação originada de proposta aprovada',
    precoDiferenciado:'Não', precPrev:p.preco, precAj:0, possuiAjPreco:'não', tipoPreco:p.tipoPreco||'Preço fixo', flexPreco:(p.piso||p.teto)?'Sim':'Não', tipoSpread:p.tipoSpread||'', indice:p.indicePreco||'', spread:p.spread||0, pisoFlex:p.piso||0, tetoFlex:p.teto||0,
    indiceReaj:p.indReaj&&p.indReaj!=='Nenhum'?p.indReaj:'', dataBase:p.dataBase?new Date(p.dataBase):null, dataPrimReaj:p.primReaj?new Date(p.primReaj):null, valorNF:0 };
}

function viewPropostaListagem(propsAll){
  var propHasFilter=PROP_INI||PROP_FIM||PROP_SEARCH||PROP_COL_EMP||PROP_COL_NEG||PROP_COL_TIPO||PROP_COL_SUB||PROP_COL_FONTE||PROP_COL_CLASSIF;

    '<label style="display:flex;flex-direction:column;gap:4px"><span class="ficha-label">Fim do suprimento (até)</span><input type="date" id="propFim" value="'+esc(PROP_FIM)+'" style="background:#0f1117;border:1px solid #2d3148;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:12px;width:150px"></label>'+
    '<label style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:220px"><span class="ficha-label">Buscar (negócio, empresa, CCEE, submercado, fonte, negociante...)</span><input type="text" id="propSearch" value="'+esc(PROP_SEARCH)+'" placeholder="Pesquisa rápida" style="background:#0f1117;border:1px solid #2d3148;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:12px;width:100%"></label>'+
    (propHasFilter?'<button class="btn btn-ghost" id="propClearFilters">Limpar filtros</button>':'')+
    '</div>';
  var filtered=propsAll.filter(function(p){ return rangeOverlapStr(p,PROP_INI,PROP_FIM)&&matchesSearchProp(p,PROP_SEARCH); });
  filtered=filtered.filter(function(p){
    if(PROP_COL_EMP&&p.empresa!==PROP_COL_EMP) return false;

      '<span class="badge badge-gray">'+esc(p.submercado)+'</span>'+
      '<span class="badge badge-purple">'+esc(p.fonte)+'</span>'+
      '<span style="color:#94a3b8;font-size:12px">'+esc(p.empresa)+'</span>'+
      '<span style="margin-left:auto;display:flex;gap:8px"><button class="btn btn-ghost" data-pdf="'+p.id+'">Baixar PDF</button><button class="btn btn-primary" data-approve="'+p.id+'" style="background:#16a34a">Aprovar → vira operação</button><button class="btn btn-ghost" data-del="'+p.id+'" style="color:#f87171;border-color:#5c2020">Excluir</button></span></div>'+
      '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px">'+

      '<div><div class="ficha-label">Exposição estimada</div><div class="ficha-value" style="color:#fbbf24">'+fmtR(exp)+'</div></div>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px">'+
      '<div><div class="ficha-label">Sazonalidade</div><div class="ficha-value">'+esc(p.sazTipo||p.saz||'Flat')+((p.sazSup||p.sazInf)?' ('+fmt(p.sazInf||0,0)+'%–'+fmt(p.sazSup||0,0)+'%)':'')+'</div></div>'+

      '<div><div class="ficha-label">Flexibilidade</div><div class="ficha-value">+'+fmt(p.flexSup||0,0)+'% / −'+fmt(p.flexInf||0,0)+'%</div></div>'+
      '<div><div class="ficha-label">Índice de reajuste</div><div class="ficha-value">'+esc(p.indReaj&&p.indReaj!=='Nenhum'?p.indReaj:'—')+'</div></div>'+

  });
  return h;

function bindMtM(){
  var cs=STATE.contracts.filter(function(c){ return monthOverlap(c,MTM_MES)&&dateOverlap(c,MTM_DATA)&&matchesSearch(c,MTM_SEARCH); }), M=loadMtM();
  function val(id){ var e=document.getElementById(id); return e?e.value:''; }
  function err(m){ var e=document.getElementById('mtmErr'); if(e){ e.textContent=m; e.style.display='inline'; } }

  var fs=document.getElementById('mtmFiltSearch'); if(fs) fs.oninput=function(){ MTM_SEARCH=fs.value; document.getElementById('viewBody').innerHTML=viewMtM(); bindMtM(); document.getElementById('mtmFiltSearch').focus(); };

  function num2(v){ return parseFloat(String(v).replace(',','.')); }
  function readRef(){ M.refMonth=val('mtmRef')||M.refMonth; }
  function readConv(){ var months=curveMonths(cs,M);
    months.forEach(function(k,mi){ var v=val('base_'+mi); if(v!=='') M.base[k]=num2(v); else delete M.base[k]; });
    SUBS_OTHER.forEach(function(sub,si){ if(!M.subPrice[sub])M.subPrice[sub]={}; months.forEach(function(k,mi){ var v=val('ss_'+si+'_'+mi); if(v!=='') M.subPrice[sub][k]=num2(v); else delete M.subPrice[sub][k]; }); });
  }
  function readSpread(){ var months=curveMonths(cs,M); var seen={};
    Array.prototype.forEach.call(document.querySelectorAll('[data-fonte]'),function(el){
      var f=el.getAttribute('data-fonte'); if(!M.spread[f])M.spread[f]={}; if(!seen[f]){ seen[f]=true; }
      var id=el.id, mi=id.substring(id.lastIndexOf('_')+1); var k=months[+mi]; if(k==null) return;
      var v=el.value; if(v!=='') M.spread[f][k]=num2(v); else delete M.spread[f][k];
    });
  }
  function readAll(){ readRef(); readConv(); readSpread(); }

    err('Buscando PLD na CCEE (Dados Abertos)…');
    var ref=M.refMonth;
    sb.functions.invoke('pld-ccee',{body:{mes:ref}}).then(function(res){
      var d=res&&res.data;
      if(res&&res.error){ err('Falha ao buscar na CCEE: '+(res.error.message||res.error)+'. Informe o PLD manualmente.'); return; }
      if(!d||!d.ok||!d.precos){ err('CCEE não retornou PLD'+(d&&d.detalhe?' ('+d.detalhe+')':'')+'. Informe o PLD manualmente.'); return; }
      var p=d.precos, mesRet=d.mes||ref, aplic=[];
      if(p['SE/CO']!=null){ M.base[ref]=p['SE/CO']; aplic.push('SE/CO'); }
      SUBS_OTHER.forEach(function(sub){ if(p[sub]!=null){ if(!M.subPrice[sub])M.subPrice[sub]={}; M.subPrice[sub][ref]=p[sub]; aplic.push(sub); } });
      if(!aplic.length){ err('CCEE respondeu mas sem submercados reconhecidos. Informe o PLD manualmente.'); return; }
      saveMtM(M); document.getElementById('viewBody').innerHTML=viewMtM(); bindMtM();
      var e=document.getElementById('mtmErr'); if(e){ e.style.color='#34d399'; e.textContent='PLD '+mesRet+' preenchido na coluna de referência ('+aplic.join(', ')+') via '+(d.dataset||'CCEE')+'. Revise e clique em "Salvar tudo e recalcular".'; e.style.display='inline'; }
    }).catch(function(ex){ err('Não foi possível conectar à função de PLD: '+(ex&&ex.message||ex)+'. Informe o PLD manualmente.'); });
  };
  var tb=document.getElementById('mtmTmplBtn'); if(tb) tb.onclick=function(){ readAll(); downloadFile('modelo_curva_mtm.csv', mtmTemplateCSV(cs,M)); };

      r.readAsText(f);
    };
  }
}

      '<input class="login-input" type="email" id="loginEmail" placeholder="seu@empresa.com" autocomplete="username" required></div>'+
    '<div class="login-field"><label class="login-label">Senha</label>'+
      '<input class="login-input" type="password" id="loginSenha" placeholder="••••••••" autocomplete="current-password" required></div>'+
    '<button type="submit" class="btn btn-primary login-btn" id="enterBtn">Entrar</button>'+
    '</form>'+
    '<div class="login-foot">Não tem conta? <button class="login-link" id="goSignup">Criar conta</button></div>'+
    '</div></div>';
}
function viewSignup(){
  var warn = sb ? '' : '<div class="login-err" style="display:block">Serviço indisponível (Supabase não carregou). Verifique a conexão.</div>';
  return '<div class="login-wrap"><div class="login-card">'+
    '<div class="login-brand">Energia<span>SaaS</span></div>'+
    '<div class="login-sub">Criar conta</div>'+
    warn+'<div class="login-err" id="suErr"></div>'+
    '<form id="suForm">'+
    '<div class="login-field"><label class="login-label">E-mail</label>'+
      '<input class="login-input" type="email" id="suEmail" placeholder="seu@email.com" autocomplete="username" required></div>'+
    '<div class="login-field"><label class="login-label">Senha</label>'+
      '<input class="login-input" type="password" id="suSenha" placeholder="Mín. 6 caracteres" autocomplete="new-password" required></div>'+
    '<button type="submit" class="btn btn-primary login-btn" id="suBtn">Criar conta e entrar</button>'+
    '</form>'+
    '<div class="login-foot">Já tem conta? <button class="login-link" id="goLogin">Entrar</button></div>'+
    '</div></div>';
}
function bindSignup(){
  var f=document.getElementById('suForm'); if(!f) return;
  var gl=document.getElementById('goLogin'); if(gl) gl.onclick=function(){ AUTH_MODE='login'; boot(); };
  f.onsubmit=function(e){ e.preventDefault();
    var err=document.getElementById('suErr'); err.style.display='none';
    var btn=document.getElementById('suBtn');
    var email=(document.getElementById('suEmail').value||'').trim().toLowerCase();
    var senha=document.getElementById('suSenha').value||'';
    function fail(m){ err.textContent=m; err.style.display='block'; btn.disabled=false; btn.textContent='Criar conta e entrar'; }
    if(!sb) return fail('Serviço indisponível.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('Informe um e-mail válido.');
    if(senha.length<6) return fail('A senha deve ter ao menos 6 caracteres.');
    btn.disabled=true; btn.textContent='Criando…';
    sb.rpc('fn_criar_conta',{p_email:email,p_senha:senha}).then(function(r){
      if(r.error) return fail('Erro: '+r.error.message);
      if(r.data==='DUPLICADO') return fail('Já existe uma conta com este e-mail. Faça login.');
      if(r.data==='SENHA_CURTA') return fail('Senha muito curta.');
      if(r.data==='EMAIL_INVALIDO') return fail('E-mail inválido.');
      // criado com sucesso → entra automaticamente
      sb.rpc('fn_login_senha',{p_email:email,p_senha:senha}).then(function(r2){
        var row=r2.data && r2.data[0];
        if(!row) return fail('Conta criada, mas falhou o login automático. Tente entrar.');
        CURRENT_USER={ email:row.email, nome:row.nome||email, role:row.role||'membro' };
        localSaveUser(CURRENT_USER); AUTH_MODE='login';
        if(typeof fetchCCEEParams==='function'){ fetchCCEEParams().then(function(){ boot(); }); } else { boot(); }
      });
    }).catch(function(ex){ fail('Falha de conexão: '+ex.message); });
  };
}
function bindLoginEmail(){
  var gs=document.getElementById('goSignup'); if(gs) gs.onclick=function(){ AUTH_MODE='signup'; boot(); };
  var f=document.getElementById('emailForm'); if(!f) return;
  f.onsubmit=function(e){ e.preventDefault();
    var err=document.getElementById('loginErr'); err.style.display='none';
    var btn=document.getElementById('enterBtn');
    var email=(document.getElementById('loginEmail').value||'').trim().toLowerCase();
    var senha=document.getElementById('loginSenha').value||'';
    if(!sb){ err.textContent='Serviço de acesso indisponível.'; err.style.display='block'; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Informe um e-mail válido.'; err.style.display='block'; return; }
    btn.disabled=true; btn.textContent='Entrando…';
    function fail(m){ err.textContent=m; err.style.display='block'; btn.disabled=false; btn.textContent='Entrar'; }
    sb.rpc('fn_login_senha',{p_email:email,p_senha:senha}).then(function(r){
      if(r.error) return fail('Erro ao entrar: '+r.error.message);
      if(!r.data || !r.data.length) return fail('E-mail ou senha inválidos.');
      var row=r.data[0];
      CURRENT_USER={ email:row.email, nome:row.nome||email, role:row.role||'membro' };
      localSaveUser(CURRENT_USER);
      if(typeof fetchCCEEParams==='function'){ fetchCCEEParams().then(function(){ boot(); }); } else { boot(); }
    }).catch(function(ex){ fail('Falha de conexão: '+ex.message); });
  };
}

// ── Gestão de usuários (aba Configurações — somente admin) ─────────────────
function cfgUsersSection(){
  if(!isAdmin()) return '';
  var inp='style="background:#0f1117;border:1px solid #2d3148;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:12px;outline:none;width:100%"';
  return '<div class="section-header"><span class="section-title">Usuários da plataforma</span></div>'+
    '<div class="card" style="margin-bottom:20px">'+
    '<div style="color:#94a3b8;font-size:12px;margin-bottom:12px">Cadastre aqui quem pode acessar a plataforma. Só usuários ativos com senha conseguem entrar.</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1.4fr 1fr 110px auto;gap:8px;align-items:end">'+
      '<label style="display:flex;flex-direction:column;gap:4px"><span class="ficha-label">Nome</span><input id="auNome" '+inp+'></label>'+
      '<label style="display:flex;flex-direction:column;gap:4px"><span class="ficha-label">E-mail</span><input id="auEmail" type="email" '+inp+'></label>'+
      '<label style="display:flex;flex-direction:column;gap:4px"><span class="ficha-label">Senha (mín. 6)</span><input id="auSenha" type="text" '+inp+'></label>'+
      '<label style="display:flex;flex-direction:column;gap:4px"><span class="ficha-label">Papel</span><select id="auRole" '+inp+'><option value="membro">Membro</option><option value="admin">Admin</option></select></label>'+
      '<button class="btn btn-primary" id="auAdd">Cadastrar</button>'+
    '</div>'+
    '<div id="auErr" class="err" style="display:none;margin-top:8px"></div>'+
    '<div id="cfgUsersList" style="color:#cbd5e1;font-size:12px;margin-top:16px">Carregando usuários…</div>'+
    '</div>';
}
function cfgUsersBind(){
  if(!isAdmin()) return;
  var add=document.getElementById('auAdd');
  if(add) add.onclick=function(){
    var err=document.getElementById('auErr'); if(err) err.style.display='none';
    function fail(m){ if(err){ err.textContent=m; err.style.display='block'; } }
    var nome=(document.getElementById('auNome').value||'').trim();
    var email=(document.getElementById('auEmail').value||'').trim().toLowerCase();
    var senha=document.getElementById('auSenha').value||'';
    var role=document.getElementById('auRole').value;
    if(!nome) return fail('Informe o nome.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('E-mail inválido.');
    if(senha.length<6) return fail('A senha deve ter ao menos 6 caracteres.');
    sb.rpc('fn_acesso_add',{p_admin:CURRENT_USER.email,p_nome:nome,p_email:email,p_senha:senha,p_role:role}).then(function(r){
      if(r.error) return fail('Erro: '+r.error.message);
      if(r.data==='DUPLICADO') return fail('Este e-mail já está cadastrado.');
      if(r.data==='SENHA_CURTA') return fail('Senha muito curta.');
      if(r.data==='NAO_AUTORIZADO') return fail('Ação não autorizada.');
      document.getElementById('auNome').value=''; document.getElementById('auEmail').value=''; document.getElementById('auSenha').value='';
      cfgUsersRefresh();
    });
  };
  cfgUsersRefresh();
}
function cfgUsersRefresh(){
  var box=document.getElementById('cfgUsersList'); if(!box) return;
  sb.rpc('fn_acesso_listar',{p_admin:CURRENT_USER.email}).then(function(r){
    if(r.error){ box.textContent='Erro ao carregar: '+r.error.message; return; }
    var rows=r.data||[];
    var h='<table style="width:100%;border-collapse:collapse"><thead><tr style="text-align:left;color:#475569;border-bottom:1px solid #2d3148">'+
      '<th style="padding:6px 4px">Nome</th><th>E-mail</th><th>Papel</th><th>Status</th><th>Último acesso</th><th></th></tr></thead><tbody>';
    rows.forEach(function(u){
      var eu=esc(u.email), self=(u.email===CURRENT_USER.email);
      var acesso=u.ultimo_acesso?new Date(u.ultimo_acesso).toLocaleString('pt-BR'):'<span style="color:#475569">nunca</span>';
      h+='<tr style="border-bottom:1px solid #1e2433">'+
        '<td style="padding:7px 4px;color:#e2e8f0">'+esc(u.nome||'')+'</td>'+
        '<td style="color:#94a3b8">'+eu+(self?' <span style="color:#4f7cff">(você)</span>':'')+'</td>'+
        '<td>'+(u.role==='admin'?'<span class="badge badge-red">Admin</span>':'Membro')+'</td>'+
        '<td>'+(u.ativo?'<span style="color:#34d399">Ativo</span>':'<span style="color:#64748b">Inativo</span>')+'</td>'+
        '<td style="color:#64748b;font-size:11px">'+acesso+'</td>'+
        '<td style="text-align:right;white-space:nowrap">'+
          '<button class="login-link" data-pwd-user="'+eu+'">Redefinir senha</button> '+
          (self?'':'<button class="login-link" data-toggle-user="'+eu+'" data-ativo="'+(u.ativo?1:0)+'">'+(u.ativo?'Desativar':'Ativar')+'</button> '+
                 '<button class="login-link" data-del-user="'+eu+'" style="color:#f87171">Excluir</button>')+
        '</td></tr>';
    });
    h+='</tbody></table>';
    box.innerHTML=h;
    Array.prototype.forEach.call(box.querySelectorAll('[data-pwd-user]'),function(el){ el.onclick=function(){
      var email=el.getAttribute('data-pwd-user');
      var nova=prompt('Nova senha para '+email+' (mín. 6 caracteres):'); if(nova==null) return;
      if(nova.length<6){ alert('Senha muito curta.'); return; }
      sb.rpc('fn_definir_senha',{p_admin:CURRENT_USER.email,p_email:email,p_senha:nova}).then(function(r){ alert(r.data==='OK'?'Senha atualizada.':'Falha: '+(r.data||(r.error&&r.error.message))); });
    };});
    Array.prototype.forEach.call(box.querySelectorAll('[data-toggle-user]'),function(el){ el.onclick=function(){
      var email=el.getAttribute('data-toggle-user'), novo=el.getAttribute('data-ativo')!=='1';
      sb.rpc('fn_acesso_set_ativo',{p_admin:CURRENT_USER.email,p_email:email,p_ativo:novo}).then(function(){ cfgUsersRefresh(); });
    };});
    Array.prototype.forEach.call(box.querySelectorAll('[data-del-user]'),function(el){ el.onclick=function(){
      var email=el.getAttribute('data-del-user');
      if(!confirm('Excluir o acesso de '+email+'? A pessoa não poderá mais entrar.')) return;
      sb.rpc('fn_acesso_del',{p_admin:CURRENT_USER.email,p_email:email}).then(function(){ cfgUsersRefresh(); });
    };});
  });
}
function boot(){
  var root=document.getElementById('root');
  if(!LOGIN_ENABLED){ if(!CURRENT_USER) CURRENT_USER={email:'bergoudianr@gmail.com',nome:'Rafael Campos',role:'admin'}; render(); return; }
  if(!CURRENT_USER){ var lu=localLoadUser(); if(lu && lu.email){ CURRENT_USER=lu; } }
  if(CURRENT_USER){
    if(!CLOUD_SYNCED){ CLOUD_SYNCED=true; render(); cloudLoadAll(function(){ var s=loadContracts(); if(s) STATE.contracts=s; render(); }); return; }
    render(); return;
  }
  if(AUTH_MODE==='signup'){ root.innerHTML=viewSignup(); bindSignup(); var se=document.getElementById('suEmail'); if(se) se.focus(); return; }
  root.innerHTML=viewLoginEmail(); bindLoginEmail();
  var le=document.getElementById('loginEmail'); if(le) le.focus();
}
boot();
</script>
