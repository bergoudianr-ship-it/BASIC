<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Energia SaaS — Gestão de Contratos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e2e8f0; font-size: 13px; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: #1a1d27; }
  ::-webkit-scrollbar-thumb { background: #3a3f55; border-radius: 3px; }

  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .header { background: #13161f; border-bottom: 1px solid #252836; padding: 12px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  .logo span { color: #3b82f6; }
  .header-date { margin-left: auto; color: #64748b; font-size: 12px; }
  .header-info { color: #64748b; font-size: 12px; }

  .main { display: flex; flex: 1; }
  .sidebar { width: 200px; background: #13161f; border-right: 1px solid #252836; padding: 16px 0; flex-shrink: 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; color: #94a3b8; cursor: pointer; font-size: 12px; border-left: 3px solid transparent; transition: all .15s; }
  .nav-item:hover { background: #1a1d2e; color: #cbd5e1; }
  .nav-item.active { color: #3b82f6; border-left-color: #3b82f6; background: #1a1d2e; }
  .nav-section { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: .8px; padding: 16px 20px 6px; }

  .content { flex: 1; overflow-x: hidden; padding: 24px; }

  .import-zone { border: 2px dashed #2d3148; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all .2s; background: #13161f; }
  .import-zone:hover, .import-zone.dragover { border-color: #3b82f6; background: #141827; }
  .import-title { font-size: 16px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
  .import-sub { color: #64748b; font-size: 12px; margin-bottom: 20px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; transition: all .15s; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-ghost { background: #1e2235; color: #94a3b8; border: 1px solid #2d3148; }
  .btn-ghost:hover { background: #252a3d; color: #cbd5e1; }

  .card { background: #13161f; border: 1px solid #252836; border-radius: 10px; padding: 16px; }
  .card-title { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; font-weight: 600; }
  .card-value { font-size: 22px; font-weight: 700; color: #f1f5f9; }
  .card-sub { font-size: 11px; color: #64748b; margin-top: 4px; }
  .card-delta { font-size: 12px; font-weight: 500; margin-top: 4px; }
  .delta-pos { color: #22c55e; } .delta-neg { color: #ef4444; }

  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 1200px) { .grid-4 { grid-template-columns: repeat(2,1fr); } }

  .section-header { display: flex; align-items: center; gap: 10px; margin: 28px 0 16px; }
  .section-title { font-size: 14px; font-weight: 600; color: #f1f5f9; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; padding: 8px 12px; color: #64748b; border-bottom: 1px solid #1e2235; font-weight: 500; font-size: 11px; white-space: nowrap; }
  td { padding: 8px 12px; border-bottom: 1px solid #1a1d27; color: #cbd5e1; white-space: nowrap; }
  tr:hover td { background: #161929; }
  .td-num { text-align: right; font-variant-numeric: tabular-nums; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .badge-red { background: #2d1a1a; color: #f87171; border: 1px solid #5c2020; }
  .badge-yellow { background: #2d2510; color: #fbbf24; border: 1px solid #5c4a10; }
  .badge-green { background: #0f2d1a; color: #4ade80; border: 1px solid #1a5c30; }
  .badge-blue { background: #0f1f3d; color: #60a5fa; border: 1px solid #1a3a6c; }
  .badge-gray { background: #1a1d27; color: #64748b; border: 1px solid #2d3148; }
  .badge-purple { background: #1e1a35; color: #a78bfa; border: 1px solid #3d2f6c; }

  .alert-row-crit td { background: #1a0f0f !important; }
  .alert-row-warn td { background: #1a160a !important; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #252836; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 8px 16px; font-size: 12px; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: #94a3b8; }
  .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; }

  .chart-card { background: #13161f; border: 1px solid #252836; border-radius: 10px; padding: 16px; }
  .chart-title { font-size: 12px; color: #94a3b8; margin-bottom: 12px; font-weight: 600; }

  .ficha { background: #13161f; border: 1px solid #252836; border-radius: 10px; margin-bottom: 12px; }
  .ficha-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .ficha-header:hover { background: #161929; }
  .ficha-body { padding: 12px 16px 16px; border-top: 1px solid #1e2235; }
  .ficha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .ficha-label { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .ficha-value { font-size: 13px; color: #e2e8f0; font-weight: 500; }

  .status-ativo { background: #0a2a18; color: #34d399; border: 1px solid #0f4025; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .status-ainc { background: #0a1a3a; color: #60a5fa; border: 1px solid #0f2a5c; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .status-enc { background: #1a1d27; color: #475569; border: 1px solid #252836; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .status-venc { background: #2d1a0a; color: #fb923c; border: 1px solid #5c300a; padding: 2px 8px; border-radius: 4px; font-size: 11px; }

  .pos-long { color: #4ade80; } .pos-short { color: #f87171; } .pos-zero { color: #64748b; }

  .paste-area { width: 100%; min-height: 140px; background: #0f1117; border: 1px solid #252836; border-radius: 8px; color: #94a3b8; font-family: monospace; font-size: 12px; padding: 12px; resize: vertical; outline: none; }
  .paste-area:focus { border-color: #3b82f6; }
  .sep { height: 1px; background: #1e2235; margin: 8px 20px; }
  .result-box { background: #0f1a2e; border: 1px solid #1e3a5f; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .result-box .rb-title { font-size: 12px; color: #60a5fa; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
  .empty-text { font-size: 14px; color: #64748b; }
  .err { color: #ef4444; font-size: 12px; margin-top: 6px; }

  /* CSS bar chart */
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 180px; padding-top: 10px; }
  .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar-pair { display: flex; gap: 3px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
  .bar { width: 18px; border-radius: 3px 3px 0 0; transition: height .3s; }
  .bar-label { font-size: 10px; color: #64748b; }
  .legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: #94a3b8; }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";
// ── Helpers ──────────────────────────────────────────────────────────────
var TODAY = new Date('2026-06-01');
var COLORS = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#a78bfa','#06b6d4','#f97316'];
function fmt(n, dec){ dec = dec==null?2:dec; if(n==null||isNaN(n)) return '—'; return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtR(n){ return (n==null||isNaN(n))?'—':'R$ '+fmt(n); }
function fmtMW(n,dec){ dec=dec==null?3:dec; return (n==null||isNaN(n))?'—':fmt(n,dec)+' MWm'; }
function daysDiff(d){ return Math.round((new Date(d)-TODAY)/86400000); }
function parseDate(s){ if(!s) return null; var p=s.split(/[\/\-]/); if(p.length===3){ if(p[2].length===4) return new Date(p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')); return new Date(s);} var d=new Date(s); return isNaN(d)?null:d; }
function num(v){ if(v==null) return 0; var n=parseFloat(String(v).replace(/\./g,'').replace(',','.')); if(isNaN(n)){ n=parseFloat(String(v).replace(',','.')); } return isNaN(n)?0:n; }
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function lc(s){ return (s||'').toLowerCase(); }
function isCompra(c){ return lc(c.tipoOp).indexOf('compra')>=0; }
function isVenda(c){ return lc(c.tipoOp).indexOf('venda')>=0; }
// Padroniza a fonte de energia conforme os produtos da BBCE
function normFonte(raw){
  var s=(raw||'').toString().trim(); if(!s) return 'N/D';
  var l=s.toLowerCase();
  function pct(){ if(l.indexOf('100')>=0) return '100%'; if(l.indexOf('80')>=0) return '80%'; if(l.indexOf('50')>=0) return '50%'; if(/(^|[^0-9])0\s*%/.test(l)||l.indexOf('incentivada 0')>=0||/\bi-?0\b/.test(l)||l.indexOf('i zero')>=0||l.indexOf('izero')>=0) return '0%'; return ''; }
  if(l.indexOf('cogera')>=0||l.indexOf('cogeração')>=0||l.indexOf('cqualif')>=0||l==='cq'||l.indexOf('cq ')>=0){ return 'Cogeração Qualificada '+(pct()||'50%'); }
  if(l.indexOf('convenc')>=0||l==='con'||l==='cv') return 'Convencional';
  if(l.indexOf('incentiv')>=0||l.indexOf('especial')>=0){ return 'Incentivada '+(pct()||'50%'); }
  if(/eol|e[oó]lic|vento|ufv|solar|fotovolt|\bpch\b|\bcgh\b|biomass|biog[aá]s|baga[çc]o|pequena central|mini ?central|res[ií]duo/.test(l)){ return 'Incentivada '+(pct()||'50%'); }
  if(/\buhe\b|\bute\b|usina hidr|hidrel[eé]tr|termel|t[eé]rmic|g[aá]s natural|carv[aã]o|[oó]leo|nuclear|f[oó]ssil/.test(l)){ return 'Convencional'; }
  return s;
}

// ── CSV parser (zero deps) ───────────────────────────────────────────────
function detectDelim(line){ var c=['\t','|',';',','].map(function(d){return {d:d,n:line.split(d).length};}); c.sort(function(a,b){return b.n-a.n;}); return c[0].d; }
function parseCSV(raw){
  raw = raw.replace(/\r/g,'').trim();
  var lines = raw.split('\n').filter(function(l){return l.trim()!=='';});
  if(lines.length<2) return [];
  var delim = detectDelim(lines[0]);
  function splitLine(line){
    var out=[], cur='', q=false;
    for(var i=0;i<line.length;i++){ var ch=line[i];
      if(ch==='"'){ if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(ch===delim && !q){ out.push(cur); cur=''; }
      else cur+=ch;
    }
    out.push(cur); return out.map(function(x){return x.trim();});
  }
  var headers = splitLine(lines[0]);
  var rows=[];
  for(var i=1;i<lines.length;i++){ var vals=splitLine(lines[i]); var o={}; for(var j=0;j<headers.length;j++){ o[headers[j]]=vals[j]||''; } rows.push(o); }
  return rows;
}
function g(row,keys){ for(var i=0;i<keys.length;i++){ if(row[keys[i]]!=null && row[keys[i]]!=='') return row[keys[i]]; if(row[keys[i]]!=null) return row[keys[i]]; } return ''; }
function parseContracts(raw){
  var rows = parseCSV(raw);
  return rows.map(function(r,i){
    return {
      _id:i,
      negocio: g(r,['Negócio','Negocio'])||('NEG-'+(i+1)),
      unidadeNegocio: g(r,['Unidade de negócio','Unidade de negocio']),
      tipoOp: g(r,['Tipo de operação','Tipo de operacao']),
      natureza: g(r,['Natureza de operação','Natureza de operacao']),
      empresa: g(r,['Empresa Responsável','Empresa Responsavel']),
      negociante: g(r,['Negociante']),
      operador: g(r,['Operador']),
      origem: g(r,['Origem da operação','Origem da operacao']),
      dataCriacao: parseDate(g(r,['Data de criação','Data de criacao'])),
      contratoCCEE: g(r,['Contrato CCEE']),
      inicioForn: parseDate(g(r,['Início do fornecimento','Inicio do fornecimento'])),
      fimForn: parseDate(g(r,['Fim do fornecimento'])),
      volPrevMWm: num(g(r,['Volume previsto (MWm)'])),
      volPrevMWh: num(g(r,['Volume previsto (MWh)'])),
      volAjMWm: num(g(r,['Volume ajustado (MWm)'])),
      volAjMWh: num(g(r,['Volume ajustado (MWh)'])),
      possuiAjVol: lc(g(r,['Possui ajuste de volume'])),
      submercado: g(r,['Submercado']),
      possuiAjSub: lc(g(r,['Possui ajuste de submercado'])),
      fonte: normFonte(g(r,['Fonte de energia'])),
      retusd: lc(g(r,['RETUSD'])),
      classificacao: g(r,['Classificação','Classificacao']),
      flexSup: num(g(r,['Flexibilidade superior'])),
      flexInf: num(g(r,['Flexibilidade inferior'])),
      condPag: g(r,['Condição de pagamento','Condicao de pagamento']),
      datFimCondPag: parseDate(g(r,['Data Final Condição de pagamento','Data Final Condicao de pagamento'])),
      obsFinanceiro: g(r,['Observação Financeiro','Observacao Financeiro']),
      precPrev: num(g(r,['Preço previsto','Preco previsto'])),
      precAj: num(g(r,['Preço ajustado','Preco ajustado'])),
      possuiAjPreco: lc(g(r,['Possui ajuste de preço','Possui ajuste de preco'])),
      tipoSpread: g(r,['Tipo de Spread']),
      indice: g(r,['Índice','Indice']),
      spread: num(g(r,['Spread'])),
      pisoFlex: num(g(r,['Piso da flexibilidade de preço','Piso da flexibilidade de preco'])),
      tetoFlex: num(g(r,['Teto da flexibilidade de preço','Teto da flexibilidade de preco'])),
      indiceReaj: g(r,['Índice de reajuste','Indice de reajuste']),
      dataPrimReaj: parseDate(g(r,['Data do 1o reajuste','Data do 1º reajuste'])),
      valorNF: num(g(r,['Valor NF']))
    };
  });
}
function status(c){
  if(!c.inicioForn||!c.fimForn) return {label:'Indefinido',cls:'status-enc',code:'indef'};
  var d=daysDiff(c.fimForn);
  if(c.fimForn<TODAY) return {label:'Encerrado',cls:'status-enc',code:'enc'};
  if(c.inicioForn>TODAY) return {label:'A iniciar',cls:'status-ainc',code:'ainc'};
  if(d<=30) return {label:'Vencendo em '+d+'d',cls:'status-venc',code:'venc'};
  return {label:'Ativo',cls:'status-ativo',code:'ativo'};
}
function alerts(c){
  var a=[], st=status(c);
  if(c.fimForn){ var d=daysDiff(c.fimForn); if(d>=0&&d<=30) a.push({msg:'Fim de fornecimento em '+d+' dias',crit:'Crítico'}); else if(d>30&&d<=90) a.push({msg:'Fim de fornecimento em '+d+' dias',crit:'Atenção'}); }
  if(!c.contratoCCEE) a.push({msg:'Sem Contrato CCEE registrado',crit:'Crítico'});
  if((c.possuiAjVol==='sim'||c.possuiAjVol==='yes')&&c.volAjMWm===0) a.push({msg:'Ajuste de volume pendente',crit:'Atenção'});
  if((c.possuiAjPreco==='sim'||c.possuiAjPreco==='yes')&&c.precAj===0) a.push({msg:'Ajuste de preço pendente',crit:'Atenção'});
  if(c.possuiAjSub==='sim'||c.possuiAjSub==='yes') a.push({msg:'Ajuste de submercado pendente',crit:'Atenção'});
  if(st.code==='ativo'&&c.valorNF===0) a.push({msg:'Valor NF zerado com fornecimento ativo',crit:'Crítico'});
  if(c.datFimCondPag&&c.datFimCondPag<TODAY) a.push({msg:'Condição de pagamento vencida',crit:'Atenção'});
  if(c.dataPrimReaj){ var dr=daysDiff(c.dataPrimReaj); if(dr<0) a.push({msg:'1º reajuste vencido sem aplicação',crit:'Atenção'}); else if(dr<=30) a.push({msg:'1º reajuste em '+dr+' dias',crit:'Atenção'}); }
  if((c.flexSup>0||c.flexInf>0)&&st.code==='venc') a.push({msg:'Flexibilidade próxima do vencimento sem exercício',crit:'Crítico'});
  return a;
}
function expFin(c){ return (c.volAjMWh||c.volPrevMWh)*(c.precAj||c.precPrev); }
function volMWm(c){ return c.volAjMWm||c.volPrevMWm; }
function volMWh(c){ return c.volAjMWh||c.volPrevMWh; }

// ── State ────────────────────────────────────────────────────────────────
var STATE = { contracts: [], tab: 'dashboard' };
var NAV = [['dashboard','Dashboard'],['alertas','Alertas'],['proposta','Criação de Proposta'],['contratos','Contratos'],['portfolio','Portfólio'],['mtm','MtM Contrapartes'],['posicao','Posição Mensal'],['recomendacoes','Recomendações']];
var MARKET_PRICE = null;
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/\b(sa|ltda|me|epp|eireli|energia|comercializadora|geracao)\b/g,'').replace(/[^a-z0-9]/g,''); }
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }

// ── Render helpers ───────────────────────────────────────────────────────
function metric(title,value,sub,delta,sign){
  return '<div class="card"><div class="card-title">'+esc(title)+'</div><div class="card-value">'+value+'</div>'+
    (sub?'<div class="card-sub">'+esc(sub)+'</div>':'')+
    (delta!=null?'<div class="card-delta '+(sign>=0?'delta-pos':'delta-neg')+'">'+esc(delta)+'</div>':'')+'</div>';
}
function cssBars(data, keys, colors, names){
  var max=0; data.forEach(function(d){ keys.forEach(function(k){ if(d[k]>max) max=d[k]; }); }); if(max===0) max=1;
  var h='<div class="bars">';
  data.forEach(function(d){
    h+='<div class="bar-group"><div class="bar-pair">';
    keys.forEach(function(k,i){ var pct=Math.max(2,(d[k]/max)*100); h+='<div class="bar" title="'+esc(names[i])+': '+fmt(d[k],2)+'" style="height:'+pct+'%;background:'+colors[i]+'"></div>'; });
    h+='</div><div class="bar-label">'+esc(d.name||d.label)+'</div></div>';
  });
  h+='</div><div class="legend">';
  names.forEach(function(n,i){ h+='<span><span class="legend-dot" style="background:'+colors[i]+'"></span>'+esc(n)+'</span>'; });
  h+='</div>';
  return h;
}
function lineChart(data, key, color){
  var w=900,hgt=200,pad=30; var vals=data.map(function(d){return d[key];});
  var max=Math.max.apply(null,vals.concat([0])), min=Math.min.apply(null,vals.concat([0]));
  if(max===min){max+=1;min-=1;}
  var sx=function(i){ return pad+i*((w-2*pad)/(data.length-1||1)); };
  var sy=function(v){ return pad+(1-(v-min)/(max-min))*(hgt-2*pad); };
  var pts=data.map(function(d,i){return sx(i)+','+sy(d[key]);}).join(' ');
  var zero=sy(0);
  var s='<svg viewBox="0 0 '+w+' '+hgt+'" style="width:100%;height:200px">';
  s+='<line x1="'+pad+'" y1="'+zero+'" x2="'+(w-pad)+'" y2="'+zero+'" stroke="#2d3148" stroke-dasharray="3 3"/>';
  s+='<polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+pts+'"/>';
  data.forEach(function(d,i){ s+='<circle cx="'+sx(i)+'" cy="'+sy(d[key])+'" r="2.5" fill="'+color+'"><title>'+esc(d.label)+': '+fmt(d[key],2)+'</title></circle>'; });
  s+='</svg>';
  return s;
}
function pieList(data){
  var total=data.reduce(function(s,x){return s+x.value;},0)||1;
  var rows=data.slice().sort(function(a,b){return b.value-a.value;}).map(function(f,i){
    return '<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+COLORS[i%COLORS.length]+';margin-right:6px"></span>'+esc(f.name)+'</td><td class="td-num">'+fmt(f.value,2)+'</td><td class="td-num">'+fmt((f.value/total)*100,1)+'%</td></tr>';
  }).join('');
  return '<table><thead><tr><th>Fonte</th><th>MWm</th><th>%</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

// ── Compute stats ────────────────────────────────────────────────────────
function computeStats(cs){
  var ativos=cs.filter(function(c){return status(c).code==='ativo';});
  var ainc=cs.filter(function(c){return status(c).code==='ainc';});
  var enc=cs.filter(function(c){return status(c).code==='enc';});
  var compras=cs.filter(isCompra), vendas=cs.filter(isVenda);
  var volC=compras.reduce(function(s,c){return s+volMWm(c);},0);
  var volV=vendas.reduce(function(s,c){return s+volMWm(c);},0);
  var volCh=compras.reduce(function(s,c){return s+volMWh(c);},0);
  var volVh=vendas.reduce(function(s,c){return s+volMWh(c);},0);
  var rec=vendas.reduce(function(s,c){return s+expFin(c);},0);
  var custo=compras.reduce(function(s,c){return s+expFin(c);},0);
  var margem=rec-custo;
  var bySub={}; cs.forEach(function(c){ var s=c.submercado||'N/D'; if(!bySub[s])bySub[s]={compra:0,venda:0}; if(isCompra(c))bySub[s].compra+=volMWm(c); else bySub[s].venda+=volMWm(c); });
  var byFonte={}; cs.forEach(function(c){ var f=c.fonte||'N/D'; byFonte[f]=(byFonte[f]||0)+volMWm(c); });
  var byNeg={}; cs.forEach(function(c){ var n=c.negociante||'N/D'; if(!byNeg[n])byNeg[n]={vol:0,val:0,count:0}; byNeg[n].vol+=volMWm(c); byNeg[n].val+=expFin(c); byNeg[n].count++; });
  var byEmp={}; cs.forEach(function(c){ var e=c.empresa||'N/D'; if(!byEmp[e])byEmp[e]={vol:0,val:0,count:0}; byEmp[e].vol+=volMWm(c); byEmp[e].val+=expFin(c); byEmp[e].count++; });
  var ret=cs.filter(function(c){return c.retusd==='sim'||c.retusd==='yes';});
  var months=[];
  for(var i=0;i<24;i++){ var d=new Date(TODAY); d.setMonth(d.getMonth()+i); var st=new Date(d.getFullYear(),d.getMonth(),1), en=new Date(d.getFullYear(),d.getMonth()+1,0);
    var act=cs.filter(function(c){return c.inicioForn&&c.fimForn&&c.inicioForn<=en&&c.fimForn>=st;});
    var comp=act.filter(isCompra).reduce(function(s,c){return s+volMWm(c);},0);
    var vend=act.filter(isVenda).reduce(function(s,c){return s+volMWm(c);},0);
    var pcVal=act.filter(isCompra).reduce(function(s,c){return s+expFin(c);},0);
    var pvVal=act.filter(isVenda).reduce(function(s,c){return s+expFin(c);},0);
    var pcVh=act.filter(isCompra).reduce(function(s,c){return s+volMWh(c);},0);
    var pvVh=act.filter(isVenda).reduce(function(s,c){return s+volMWh(c);},0);
    months.push({label:d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}),comp:comp,vend:vend,saldo:vend-comp,pmComp:pcVh>0?pcVal/pcVh:0,pmVend:pvVh>0?pvVal/pvVh:0,resultado:pvVal-pcVal});
  }
  return { total:cs.length,ativos:ativos.length,ainc:ainc.length,enc:enc.length,volC:volC,volV:volV,volCh:volCh,volVh:volVh,posLiq:volV-volC,
    rec:rec,custo:custo,margem:margem,margemPct:rec>0?margem/rec*100:0,ticket:cs.length>0?(rec+custo)/cs.length:0,
    pmC:volCh>0?custo/volCh:0,pmV:volVh>0?rec/volVh:0,bySub:bySub,byFonte:byFonte,byNeg:byNeg,byEmp:byEmp,
    retCount:ret.length,expUSD:ret.reduce(function(s,c){return s+expFin(c);},0),
    ajVol:cs.filter(function(c){return (c.possuiAjVol==='sim')&&c.volAjMWm===0;}).length,
    ajPrec:cs.filter(function(c){return (c.possuiAjPreco==='sim')&&c.precAj===0;}).length,
    semCCEE:cs.filter(function(c){return !c.contratoCCEE;}).length,
    nfPend:ativos.filter(function(c){return c.valorNF===0;}).length, months:months };
}

function saveContracts(){ try{ localStorage.setItem('saas_contracts', JSON.stringify(STATE.contracts)); }catch(e){} }
function reviveContract(c){ ['dataCriacao','inicioForn','fimForn','datFimCondPag','dataPrimReaj','dataBase'].forEach(function(f){ c[f]=c[f]?new Date(c[f]):null; }); c.fonte=normFonte(c.fonte); return c; }
function loadContracts(){ try{ var s=localStorage.getItem('saas_contracts'); if(!s) return null; var a=JSON.parse(s); return a&&a.length?a.map(reviveContract):null; }catch(e){ return null; } }
function clearStored(){ try{ localStorage.removeItem('saas_contracts'); }catch(e){} }

// ── Propostas ────────────────────────────────────────────────────────────
function loadProps(){ try{ return JSON.parse(localStorage.getItem('saas_proposals')||'[]'); }catch(e){ return []; } }
function saveProps(p){ try{ localStorage.setItem('saas_proposals', JSON.stringify(p)); }catch(e){} }
function peekPropSeq(){ var n=0; try{ n=parseInt(localStorage.getItem('saas_prop_seq')||'0',10)||0; }catch(e){} return 'PROP-'+String(n+1).padStart(4,'0'); }
function nextPropSeq(){ var n=0; try{ n=parseInt(localStorage.getItem('saas_prop_seq')||'0',10)||0; }catch(e){} n++; try{ localStorage.setItem('saas_prop_seq', String(n)); }catch(e){} return 'PROP-'+String(n).padStart(4,'0'); }
function proposalPDF(p){

    '.hd .num{text-align:right} .hd .num b{font-size:16px;color:#1d4ed8} .hd .num div{color:#64748b;font-size:11px;margin-top:3px}'+
    '.tag{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:bold;color:#fff;margin:14px 0}'+
    'table{width:100%;border-collapse:collapse;margin-top:8px} td{padding:8px 10px;border-bottom:1px solid #e5e9f0;vertical-align:top}'+
    'td.l{color:#64748b;width:38%;font-size:12px} td.v{color:#0f172a;font-weight:600}'+
    '.sec{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#1d4ed8;font-weight:bold;margin:22px 0 4px;border-bottom:1px solid #dbe3f0;padding-bottom:4px}'+
    '.foot{margin-top:34px;color:#94a3b8;font-size:11px;border-top:1px solid #e5e9f0;padding-top:12px;line-height:1.6}'+

function propMWh(p){ var ini=p.inicio?new Date(p.inicio):null, fim=p.fim?new Date(p.fim):null; var horas=(ini&&fim&&fim>=ini)?((fim-ini)/3600000+24):0; return p.vol*horas; }
function propExposure(p){ var ini=p.inicio?new Date(p.inicio):null, fim=p.fim?new Date(p.fim):null; var horas=(ini&&fim&&fim>=ini)?((fim-ini)/3600000+24):0; return p.vol*horas*p.preco; }
function contractFromProposal(p){
  var ini=p.inicio?new Date(p.inicio):null, fim=p.fim?new Date(p.fim):null;
  var horas=(ini&&fim&&fim>=ini)?((fim-ini)/3600000+24):0;
  return { _id:'op_'+Date.now()+'_'+Math.floor(Math.random()*10000),
    negocio:p.negocio||('OP-'+Date.now()), unidadeNegocio:p.unidade||'', tipoOp:p.tipoOp, natureza:p.natureza||'Bilateral',
    empresa:p.empresa, negociante:p.negociante||'', operador:p.operador||'', origem:p.origem||'Proposta aprovada',
    dataCriacao:new Date(), contratoCCEE:p.ccee||'', inicioForn:ini, fimForn:fim,
    volPrevMWm:p.vol, volPrevMWh:p.vol*horas, volAjMWm:0, volAjMWh:0, possuiAjVol:'não',
    submercado:p.submercado, possuiAjSub:'não', fonte:normFonte(p.fonte), retusd:(p.ret||'não').toLowerCase(), classificacao:p.classif||'ACL',
    modulacao:p.sazTipo||p.saz||'', sazSup:p.sazSup||0, sazInf:p.sazInf||0, flexSup:p.flexSup||0, flexInf:p.flexInf||0, condPag:p.condPag||'', datFimCondPag:null, obsFinanceiro:'Operação originada de proposta aprovada',
    precPrev:p.preco, precAj:0, possuiAjPreco:'não', tipoSpread:p.tipoSpread||'', indice:p.indicePreco||'', spread:p.spread||0, pisoFlex:p.piso||0, tetoFlex:p.teto||0,
    indiceReaj:p.indReaj&&p.indReaj!=='Nenhum'?p.indReaj:'', dataBase:p.dataBase?new Date(p.dataBase):null, dataPrimReaj:p.primReaj?new Date(p.primReaj):null, valorNF:0 };
}

function bindProposta(){
  function v(id){ var e=document.getElementById(id); return e?e.value:''; }
  function err(m){ var e=document.getElementById('pErr'); if(e){ e.textContent=m; e.style.display='block'; } }
  var cr=document.getElementById('pCreate');
  if(cr) cr.onclick=function(){
    var emp=v('pEmp').trim(), vol=parseFloat(v('pVol')), preco=parseFloat(v('pPreco'));
    if(!emp){ err('Informe a contraparte.'); return; }
    if(isNaN(vol)||vol<=0){ err('Informe um volume válido (MWm).'); return; }
    if(isNaN(preco)||preco<=0){ err('Informe um preço válido (R$/MWh).'); return; }
    if(!v('pIni')||!v('pFim')){ err('Informe início e fim do fornecimento.'); return; }
    var props=loadProps();
    var p={ id:'p_'+Date.now()+'_'+Math.floor(Math.random()*10000), negocio:nextPropSeq(), empresa:emp, unidade:v('pUnidade').trim(), negociante:v('pNegoc').trim(), operador:v('pOperador').trim(), origem:v('pOrigem'), tipoOp:v('pTipo'), natureza:v('pNatureza'), classif:v('pClassif'), ccee:v('pCCEE').trim(), submercado:v('pSub'), fonte:v('pFonte'), ret:v('pRet'), vol:vol, preco:preco, inicio:v('pIni'), fim:v('pFim'), sazTipo:v('pSazTipo'), sazSup:parseFloat(v('pSazSup'))||0, sazInf:parseFloat(v('pSazInf'))||0, flexSup:parseFloat(v('pFlexSup'))||0, flexInf:parseFloat(v('pFlexInf'))||0, condPag:v('pCondPag').trim(), tipoSpread:v('pTipoSpread'), indicePreco:v('pIndicePreco').trim(), spread:parseFloat(v('pSpread'))||0, piso:parseFloat(v('pPiso'))||0, teto:parseFloat(v('pTeto'))||0, indReaj:v('pIndReaj'), dataBase:v('pDataBase'), primReaj:v('pPrimReaj'), criadoEm:new Date().toISOString() };
    props.push(p); saveProps(props); proposalPDF(p); render();
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-pdf]'),function(el){ el.onclick=function(){ var id=el.getAttribute('data-pdf'); var p=loadProps().filter(function(x){return x.id===id;})[0]; if(p) proposalPDF(p); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-approve]'),function(el){ el.onclick=function(){ var id=el.getAttribute('data-approve'); var props=loadProps(); var p=null; props=props.filter(function(x){ if(x.id===id){ p=x; return false; } return true; }); if(p){ STATE.contracts.push(contractFromProposal(p)); saveContracts(); saveProps(props); STATE.tab='portfolio'; render(); } }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(el){ el.onclick=function(){ var id=el.getAttribute('data-del'); var props=loadProps().filter(function(x){return x.id!==id;}); saveProps(props); render(); }; });
}

  var critCount=STATE.contracts.reduce(function(s,c){return s+alerts(c).filter(function(a){return a.crit==='Crítico';}).length;},0);
  var h='<div class="app"><div class="header"><div class="logo">Energia<span>SaaS</span></div>';
  if(STATE.contracts.length){ h+='<span class="header-info">'+STATE.contracts.length+' contratos carregados</span>'; if(critCount) h+='<span class="badge badge-red">'+critCount+' crítico(s)</span>'; h+='<button class="btn btn-ghost" id="clearBtn" style="margin-left:8px">Limpar</button>'; }
  h+='<div class="header-date">'+TODAY.toLocaleDateString('pt-BR',{weekday:'short',year:'numeric',month:'long',day:'numeric'})+'</div></div>';
  if(!STATE.contracts.length){ h+='<div class="content">'+viewImport()+'</div></div>'; root.innerHTML=h; bindImport(); return; }
  h+='<div class="main"><div class="sidebar"><div class="nav-section">Análise</div>';
  NAV.forEach(function(n){ h+='<div class="nav-item '+(STATE.tab===n[0]?'active':'')+'" data-nav="'+n[0]+'">'+n[1]; if(n[0]==='alertas'&&critCount) h+='<span class="badge badge-red" style="margin-left:auto;font-size:10px;padding:1px 5px">'+critCount+'</span>'; h+='</div>'; });
  h+='<div class="sep"></div><div class="nav-section">Dados</div><div class="nav-item" data-nav="_import">Nova importação</div></div>';
  h+='<div class="content"><div class="tabs">';
  NAV.forEach(function(n){ h+='<div class="tab '+(STATE.tab===n[0]?'active':'')+'" data-nav="'+n[0]+'">'+n[1]+'</div>'; });
  h+='</div><div id="viewBody">'+renderView()+'</div></div></div></div>';
  root.innerHTML=h;
  bindApp();
}
function renderView(){
  switch(STATE.tab){
    case 'dashboard': return viewDashboard();
    case 'alertas': return viewAlertas();
    case 'contratos': return viewContratos();
    case 'portfolio': return viewPortfolio();
    case 'mtm': return viewMtM();
    case 'proposta': return viewProposta();
    case 'posicao': return viewPosicao();
    case 'recomendacoes': return viewRecomendacoes();
    default: return viewDashboard();
  }
}
function bindImport(){
  var fi=document.getElementById('fileInput'), dz=document.getElementById('dropZone'), pb=document.getElementById('pickBtn');
  var ab=document.getElementById('analyzeBtn'), sb=document.getElementById('sampleBtn'), pa=document.getElementById('pasteArea');
  function load(raw){ try{ var cs=parseContracts(raw); if(!cs.length){ showErr('Nenhum contrato encontrado. Verifique o formato.'); return; } STATE.contracts=cs; saveContracts(); STATE.tab='dashboard'; render(); }catch(e){ showErr('Erro: '+e.message); } }
  function showErr(m){ var e=document.getElementById('importErr'); e.textContent=m; e.style.display='block'; }
  pb.onclick=function(e){ e.stopPropagation(); fi.click(); };
  dz.onclick=function(){ fi.click(); };
  fi.onchange=function(){ var f=fi.files[0]; if(f){ var r=new FileReader(); r.onload=function(ev){load(ev.target.result);}; r.readAsText(f); } };
  dz.ondragover=function(e){ e.preventDefault(); dz.classList.add('dragover'); };
  dz.ondragleave=function(){ dz.classList.remove('dragover'); };
  dz.ondrop=function(e){ e.preventDefault(); dz.classList.remove('dragover'); var f=e.dataTransfer.files[0]; if(f){ var r=new FileReader(); r.onload=function(ev){load(ev.target.result);}; r.readAsText(f); } };
  ab.onclick=function(){ load(pa.value); };
  sb.onclick=function(){ pa.value=SAMPLE; load(SAMPLE); };
  var tb=document.getElementById('tmplBtn'); if(tb) tb.onclick=function(){ downloadFile('modelo_portfolio_energia.csv', templateCSV()); };
}
function bindApp(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'),function(el){
    el.onclick=function(){ var t=el.getAttribute('data-nav'); if(t==='_import'){ STATE.contracts=[]; clearStored(); render(); } else { STATE.tab=t; render(); } };
  });
  var cb=document.getElementById('clearBtn'); if(cb) cb.onclick=function(){ STATE.contracts=[]; clearStored(); render(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'),function(el){ el.onclick=function(){ FILTER=el.getAttribute('data-filter'); document.getElementById('viewBody').innerHTML=viewContratos(); bindFichas(); bindFilters(); bindExport(); }; });
  bindFichas();
  bindExport();
  if(STATE.tab==='mtm') bindMtM();
  if(STATE.tab==='proposta') bindProposta();
}
function bindExport(){ var e=document.getElementById('exportBtn'); if(e) e.onclick=function(){ downloadFile('operacoes_companhia.csv', contractsToCSV(STATE.contracts)); }; }
function bindMtM(){
  var inp=document.getElementById('mktPrice'), btn=document.getElementById('mktApply');
  function apply(){ var v=parseFloat(inp.value); if(!isNaN(v)){ MARKET_PRICE=v; document.getElementById('viewBody').innerHTML=viewMtM(); bindMtM(); } }
  if(btn) btn.onclick=apply;
  if(inp) inp.onkeydown=function(e){ if(e.key==='Enter') apply(); };
}
function bindFilters(){ Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'),function(el){ el.onclick=function(){ FILTER=el.getAttribute('data-filter'); document.getElementById('viewBody').innerHTML=viewContratos(); bindFichas(); bindFilters(); bindExport(); }; }); }
function bindFichas(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'),function(el){
    el.onclick=function(){ var id=el.getAttribute('data-toggle'); var body=document.querySelector('[data-body="'+id+'"]'); var arrow=document.querySelector('[data-arrow="'+id+'"]'); if(body){ var open=body.style.display!=='none'; body.style.display=open?'none':'block'; if(arrow) arrow.textContent=open?'▶':'▼'; } };
  });
}

var _saved=loadContracts(); if(_saved){ STATE.contracts=_saved; }
render();
</script>
</body>
</html>
